# Builds the Android APK automatically on every push and publishes it on the Releases page
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Copy website files into the app
        run: |
          WWW=android/app/src/main/assets/www
          rm -rf "$WWW" && mkdir -p "$WWW"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'android' --exclude 'tools' \
                --exclude 'studio.html' --exclude 'studio-lib' --exclude '*.zip' --exclude '*.apk' \
                ./ "$WWW/"
          test -f "$WWW/index.html" || { echo "::error::index.html not found in the repository root"; exit 1; }
          du -sh "$WWW"

      - name: Bundle fonts for offline use
        continue-on-error: true
        run: python3 tools/localize_fonts.py android/app/src/main/assets/www

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the APK file
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/darb-imla-1.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: darb-imla-apk
          path: out/*.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Darb Imla 1.${{ github.run_number }}
          body: |
            Android build created automatically from the latest update.
            To install: download the .apk file below on your phone, then open it.
          files: out/*.apk
          make_latest: true
