<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>درب الإملاء</title>
<meta property="og:title" content="درب الإملاء">
<meta property="og:description" content="تطبيق تفاعلي لتعلّم أساسيات الإملاء العربي: الهمزة وأحوالها، والألف اللينة، والتاء والهاء.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F3B33">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="author" content="وائل الخزاعي">
<meta name="description" content="تطبيق تفاعلي لتعلّم أساسيات الإملاء العربي، مع مدقّق ومختبر للهمزة يعلّل كل رسم.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E2EBE7; --ink:#12302E; --ink2:#4B6461; --line:#CBDAD5;
  --primary:#1F7A5C; --primary-ink:#FFFFFF; --primary-soft:#D6EBE2;
  --gold:#D19A1F; --gold-deep:#9A6D0C; --gold-soft:#F7E8BF;
  --noun:#2461A8; --noun-soft:#DCE8F7;
  --verb:#B02D6B; --verb-soft:#F7DCE9;
  --part:#7042B8; --part-soft:#E8DEF7;
  --ok:#1B7F4B; --ok-soft:#D5F0E1; --bad:#B8401A; --bad-soft:#FBDDD1;
  --c-raf:#1B7F4B; --c-raf-s:#D5F0E1;
  --c-nasb:#B0680F; --c-nasb-s:#F8E6C6;
  --c-jar:#0B7F90; --c-jar-s:#D3EEF2;
  --c-jazm:#B23F32; --c-jazm-s:#F8DAD5;
  --c-root:#0B7F90; --c-root-s:#D3EEF2; --c-zaid:#C4610A; --c-zaid-s:#FBE3CC; --c-mark:#7A45C2; --fs:1;
  --bar:#0F3B33; --bar-ink:#F1F7F4; --bar-dim:#A9CDC1;
  --shadow:0 1px 2px rgba(18,48,46,.08),0 8px 22px rgba(18,48,46,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1918; --surface:#142624; --surface2:#1C3532; --ink:#E4F1EE; --ink2:#9DB7B2; --line:#2B4541;
    --primary:#3FBF92; --primary-ink:#06231B; --primary-soft:#16382F;
    --gold:#E3B341; --gold-deep:#F0CB6E; --gold-soft:#3A2F10;
    --noun:#7DB2F0; --noun-soft:#16304F; --verb:#F08AB8; --verb-soft:#4A1B34; --part:#B79CF0; --part-soft:#32204F;
    --ok:#52D08B; --ok-soft:#12382A; --bad:#F0845A; --bad-soft:#4A2214;
    --c-raf:#52D08B; --c-raf-s:#12382A; --c-nasb:#F0B85A; --c-nasb-s:#43300F;
    --c-jar:#5FCFE0; --c-jar-s:#0F3A42; --c-jazm:#F08A7C; --c-jazm-s:#4A1F1A;
    --c-root:#5FCFE0; --c-root-s:#0F3A42; --c-zaid:#F5A45A; --c-zaid-s:#4A2B0F; --c-mark:#B79CF0;
    --bar:#0A2622; --bar-ink:#E4F1EE; --bar-dim:#8FB3A8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1918; --surface:#142624; --surface2:#1C3532; --ink:#E4F1EE; --ink2:#9DB7B2; --line:#2B4541;
  --primary:#3FBF92; --primary-ink:#06231B; --primary-soft:#16382F;
  --gold:#E3B341; --gold-deep:#F0CB6E; --gold-soft:#3A2F10;
  --noun:#7DB2F0; --noun-soft:#16304F; --verb:#F08AB8; --verb-soft:#4A1B34; --part:#B79CF0; --part-soft:#32204F;
  --ok:#52D08B; --ok-soft:#12382A; --bad:#F0845A; --bad-soft:#4A2214;
  --c-raf:#52D08B; --c-raf-s:#12382A; --c-nasb:#F0B85A; --c-nasb-s:#43300F;
  --c-jar:#5FCFE0; --c-jar-s:#0F3A42; --c-jazm:#F08A7C; --c-jazm-s:#4A1F1A;
  --c-root:#5FCFE0; --c-root-s:#0F3A42; --c-zaid:#F5A45A; --c-zaid-s:#4A2B0F; --c-mark:#B79CF0;
  --bar:#0A2622; --bar-ink:#E4F1EE; --bar-dim:#8FB3A8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 Tajawal,system-ui,sans-serif;margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--primary);font-weight:700}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
h1,h2,h3,p{margin:0}
h2{font:700 24px/1.4 Amiri,serif;text-wrap:balance}
h3{font:700 15px/1.5 Tajawal,sans-serif;color:var(--ink2);margin-top:14px}
b{font-weight:700}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media (min-width:700px){#app{max-width:680px;border-inline:1px solid var(--line)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px}
#view>*{flex:none}
#tabs{flex:none;display:flex;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:none;border-radius:12px;padding:6px 4px;color:var(--ink2);font:500 12px/1.4 Tajawal,sans-serif}
#tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--primary);background:var(--primary-soft);font-weight:700}

/* level bar */
#lvbar{flex:none;display:flex;align-items:center;gap:12px;background:var(--bar);color:var(--bar-ink);padding:8px 16px}
#lvbar .lb-b .badge{width:48px;height:48px;display:block}
#lvbar .lb-b .badge .bt{fill:var(--gold-deep)}
#lvbar .lb-t{display:flex;flex-direction:column;min-width:0}
#lvbar small{font:500 13px/1.4 Tajawal,sans-serif;color:var(--bar-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvbar b{font:700 28px/1.6 Amiri,serif;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* في أسئلة الكتابة على الهاتف: شريط علوي صغير طوال السؤال (لا عند التركيز فقط، كي لا تقفز الصفحة تحت الإصبع فيضيع اللمس) */
@media (max-width:700px){
body:has(.qcard .txt.wr:not(:disabled)) #lvbar{padding:2px 16px}
body:has(.qcard .txt.wr:not(:disabled)) #lvbar .lb-b,body:has(.qcard .txt.wr:not(:disabled)) #lvbar small,body:has(.qcard .txt.wr:not(:disabled)) #lvbar .lb-d,body:has(.qcard .txt.wr:not(:disabled)) #legend{display:none}
body:has(.qcard .txt.wr:not(:disabled)) #lvbar b{font-size:18px;line-height:1.5}
}
#lvbar .lb-d{margin-inline-start:auto;display:flex;gap:5px;align-self:flex-end;padding-bottom:8px}
#lvbar .lb-d i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22)}
#lvbar .lb-d i.won{background:var(--gold)}
#lvbar .lb-d i.cur{background:transparent;box-shadow:0 0 0 2px var(--gold)}

/* basics */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.eyebrow{font:500 13px/1.4 Tajawal,sans-serif;color:var(--ink2);letter-spacing:.04em}
.big{font:700 40px/1.4 Amiri,serif;color:var(--primary)}
.muted{color:var(--ink2)}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:46px;font:700 17px/1.4 Tajawal,sans-serif;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:none;border:2px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.row2{display:flex;gap:10px}
.row2 .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.meter{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.top{display:flex;align-items:center;gap:12px}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;display:grid;place-items:center}
.dots{display:flex;gap:4px;flex:1}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--surface2);min-width:4px}
.dots i.on{background:var(--primary)}
.tag{display:inline-block;align-self:flex-start;border-radius:99px;padding:1px 14px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface2)}
.credit{text-align:center;color:var(--ink2);font-size:14px;padding-top:4px}
.credit b{color:var(--ink);font-weight:700}
.tap{color:var(--ink2);font-size:14px;text-align:center}
.tap.bad{color:var(--bad);font-weight:700}
.note{background:var(--surface2);border-radius:12px;padding:12px 14px;min-height:60px}
.tip{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:15px}
.clue{background:var(--gold-soft);border-radius:12px;padding:10px 14px;font-size:15px}
.bl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.bl li{background:var(--surface2);border-radius:10px;padding:8px 12px}
.sec{display:flex;flex-direction:column;gap:12px}

/* home / lists */
.steps{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.step{width:100%;display:flex;align-items:center;gap:12px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.step .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font:700 16px/1 Tajawal,sans-serif;color:var(--ink2)}
.step.done .n{background:var(--primary);color:var(--primary-ink)}
.step b{display:block;font-weight:700}
.step small{color:var(--ink2);font-size:13px}
.step .go{margin-inline-start:auto;color:var(--ink2);font-size:22px}
.journey{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 6px;padding:4px 2px 8px}
@media(min-width:600px){.journey{grid-template-columns:repeat(6,1fr)}}
.journey .lv{width:auto;min-width:0}
.journey .lv span{font-size:13px}
.lv{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 14px/1.4 Amiri,serif;text-align:center;background:none;border:0;padding:0}
.lv .badge{width:62px;height:62px}
.lcard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.lcard .hd{display:flex;align-items:center;gap:12px}
.lcard .badge{width:60px;height:60px;flex:none}
.lcard h2{font-size:26px}
.lcard small{color:var(--ink2)}
.chipst{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:0 10px;background:var(--surface2);color:var(--ink2)}
.chipst.ok{background:var(--gold-soft);color:var(--gold-deep)}
.chipst.rec{background:var(--primary-soft);color:var(--primary)}
.refs{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.refs li{background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:15px}
.refs small{display:block;color:var(--ink2)}

.badge .bs rect{fill:var(--surface2);stroke:var(--line);stroke-width:2}
.badge .bc{fill:var(--surface);stroke:var(--line);stroke-width:2}
.badge .bt{font:800 26px Tajawal,sans-serif;fill:var(--ink2)}
.badge.on .bs rect{fill:var(--gold);stroke:var(--gold-deep)}
.badge.on .bc{fill:var(--gold-soft);stroke:var(--gold-deep)}
.badge.on .bt{fill:var(--gold-deep)}

/* words and colours */
.k-noun{color:var(--noun)} .k-verb{color:var(--verb)} .k-part{color:var(--part)}
.bg-noun{background:var(--noun-soft);color:var(--noun);border-color:var(--noun)!important}
.bg-verb{background:var(--verb-soft);color:var(--verb);border-color:var(--verb)!important}
.bg-part{background:var(--part-soft);color:var(--part);border-color:var(--part)!important}
.cc-raf{color:var(--c-raf)} .cc-nasb{color:var(--c-nasb)} .cc-jar{color:var(--c-jar)} .cc-jazm{color:var(--c-jazm)}
.cb-raf{background:var(--c-raf-s);color:var(--c-raf);border-color:var(--c-raf)!important}
.cb-nasb{background:var(--c-nasb-s);color:var(--c-nasb);border-color:var(--c-nasb)!important}
.cb-jar{background:var(--c-jar-s);color:var(--c-jar);border-color:var(--c-jar)!important}
.cb-jazm{background:var(--c-jazm-s);color:var(--c-jazm);border-color:var(--c-jazm)!important}
.sent{font:400 clamp(24px,7.4vw,32px)/2.1 Amiri,serif;display:flex;flex-wrap:wrap;gap:2px 14px;justify-content:center;padding:6px 0}
.w{display:inline-block}
.w.hl{background:var(--gold-soft);border-radius:10px;padding:0 10px;box-shadow:inset 0 -3px 0 var(--gold)}
.w.hl.k-noun,.w.hl.k-verb,.w.hl.k-part{background:var(--surface2)}
.endhl{background:var(--gold-soft);box-shadow:inset 0 -3px 0 var(--gold);border-radius:6px;position:relative}
.endhl.e-raf{background:var(--c-raf-s);box-shadow:inset 0 -3px 0 var(--c-raf)}
.endhl.e-nasb{background:var(--c-nasb-s);box-shadow:inset 0 -3px 0 var(--c-nasb)}
.endhl.e-jar{background:var(--c-jar-s);box-shadow:inset 0 -3px 0 var(--c-jar)}
.endhl.e-jazm{background:var(--c-jazm-s);box-shadow:inset 0 -3px 0 var(--c-jazm)}
.endhl.e-fix{background:var(--surface2);box-shadow:inset 0 -3px 0 var(--ink2)}
.endhl.gh{box-shadow:none;border-bottom:3px dashed currentColor;border-radius:4px 4px 0 0}
.endhl.gh::before{content:attr(data-m);position:absolute;left:0;right:0;top:-.7em;text-align:center;font-size:.8em;opacity:.8;line-height:1;pointer-events:none}
.bigw{font:700 clamp(40px,12vw,54px)/1.8 Amiri,serif;text-align:center}
.chip{font:400 28px/1.6 Amiri,serif;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:2px 14px;display:inline-flex;flex-direction:column;align-items:center}
.chip small{font:500 12px/1.4 Tajawal,sans-serif}
.chip.sel,.chip.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.chip.miss{border-style:dashed}
.chip.done{cursor:default}
.chip.long{font-size:22px;text-align:center}
.chip.mini{font-size:20px;padding:0 6px;border-width:1px;width:100%;justify-content:center;overflow:hidden;white-space:nowrap}
.chip.right{background:var(--ok-soft);border-color:var(--ok)!important;color:var(--ok)}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad)!important;color:var(--bad)}

/* lesson */
.lesson{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:72px;padding:8px 6px;font-size:16px;min-height:42px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tw table{border-collapse:collapse;width:100%;font-size:15px;min-width:0}
.tw td .au .c{min-width:18px;padding:0 1px}.tw td .au .c b{font-size:17px}
.tw th,.tw td{overflow-wrap:break-word}
@media(max-width:420px){.tw th,.tw td{padding:6px 6px;font-size:14px}}
.tw th,.tw td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.tw th{background:var(--surface2);font-weight:700;white-space:nowrap}
.tw table.c2{min-width:0}
.tw tr:last-child td{border-bottom:0}
.tw td:first-child{font-weight:700}
.tw .ar{font:400 21px/1.7 Amiri,serif}
.sum{display:flex;flex-direction:column;gap:8px}
.sumrow{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.sumrow b{font:700 20px/1.5 Amiri,serif}
.sumrow span{font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:400 22px/1.6 Amiri,serif;background:var(--part-soft);color:var(--part);border-radius:99px;padding:0 14px}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.detail .dw{font:700 30px/1.4 Amiri,serif}
.detail ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:15px}

/* hierarchy */
.hier{overflow-x:auto;padding-bottom:4px}
.hier ul{list-style:none;margin:0;padding:0}
.hier ul ul{margin-right:14px;padding-right:14px;border-right:2px solid var(--line)}
.hier li{position:relative;padding:4px 0}
.hier ul ul>li::before{content:'';position:absolute;right:-14px;top:1.35em;width:12px;border-top:2px solid var(--line)}
.hn{display:inline-flex;flex-direction:column;border:2px solid var(--line);border-radius:12px;padding:1px 12px;background:var(--surface);max-width:100%}
.hn b{font:700 20px/1.6 Amiri,serif}
.hn small{font-size:13px;color:var(--ink2);line-height:1.5}
.hn.k-noun{border-color:var(--noun)} .hn.k-verb{border-color:var(--verb)} .hn.k-part{border-color:var(--part)}
.hn.cc-raf{border-color:var(--c-raf)} .hn.cc-nasb{border-color:var(--c-nasb)} .hn.cc-jar{border-color:var(--c-jar)} .hn.cc-jazm{border-color:var(--c-jazm)}
.hn.gold{border-color:var(--gold);background:var(--gold-soft)}
.hn.root{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.hn.root small{color:var(--primary-ink);opacity:.85}

/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:6px}
.fbx{flex:1 1 92px;max-width:170px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--surface);text-align:center;display:flex;flex-direction:column;justify-content:center}
.fbx b{font:700 19px/1.5 Amiri,serif}
.fbx small{font-size:13px;color:var(--ink2);line-height:1.5}
.fbx .ar{font:400 22px/1.5 Amiri,serif}
.fbx.k-noun{border-color:var(--noun)} .fbx.k-verb{border-color:var(--verb)} .fbx.k-part{border-color:var(--part)}
.fbx.cc-raf{border-color:var(--c-raf)} .fbx.cc-nasb{border-color:var(--c-nasb)} .fbx.cc-jar{border-color:var(--c-jar)} .fbx.cc-jazm{border-color:var(--c-jazm)}
.fbx.gold{border-color:var(--gold);background:var(--gold-soft)}
.fa{align-self:center;font-size:22px;color:var(--ink2)}

/* anatomy */
.anat{display:grid;gap:6px 6px;padding:4px 0;overflow-x:auto}
.anat .aw{font:400 clamp(20px,6vw,26px)/1.7 Amiri,serif;text-align:center;align-self:end}
.anat .af{font:700 12px/1.4 Tajawal,sans-serif;text-align:center;border-radius:8px;padding:1px 4px;border:1.5px solid var(--line);background:var(--surface2);align-self:start}
.anat .ag{font:700 13px/1.4 Tajawal,sans-serif;text-align:center;border-radius:0 0 10px 10px;border:2px solid var(--line);border-top:0;padding:1px 4px;background:var(--surface);color:var(--ink2)}

/* decision tree */
.dt{display:flex;flex-direction:column;gap:8px}
.dt .qa{background:var(--surface2);border-radius:10px;padding:6px 12px;font-size:14px}
.dt .qa b{color:var(--primary)}
.dt .cur{background:var(--surface);border:2px solid var(--primary);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.dt .cur p{font-weight:700}
.dt .res{background:var(--ok-soft);border:2px solid var(--ok);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.dt .res .rt{font:700 22px/1.5 Amiri,serif;color:var(--ok)}

/* sentence map */
.mapwrap{background:var(--surface2);border-radius:14px;padding-top:6px;overflow-x:auto}
.smap{display:block;height:auto;user-select:none;-webkit-user-select:none}
.smap.linkable{touch-action:none}
.smap .nr{fill:var(--surface);stroke:var(--line);stroke-width:2}
.smap .nr.c-noun{stroke:var(--noun)} .smap .nr.c-verb{stroke:var(--verb)} .smap .nr.c-part{stroke:var(--part)}
.smap .nt{font:400 22px Amiri,serif;fill:var(--ink)}
.smap .nk{font:700 13px Tajawal,sans-serif}
.smap .nk.k-noun{fill:var(--noun)} .smap .nk.k-verb{fill:var(--verb)} .smap .nk.k-part{fill:var(--part)}
.smap .node{cursor:pointer;outline:none}
.smap .node:focus-visible .nr{stroke:var(--primary);stroke-width:4}
.smap .node.sel .nr{stroke:var(--gold);stroke-width:4;fill:var(--gold-soft)}
.smap .node.ok .nr{fill:var(--ok-soft);stroke:var(--ok)}
.smap .node.bad .nr{fill:var(--bad-soft);stroke:var(--bad)}
.smap .node.bad{animation:shake .4s}
.smap .arc{fill:none;stroke:var(--ink2);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;animation:draw .6s ease-out}
.smap .arc.r-raf{stroke:var(--c-raf)} .smap .arc.r-nasb{stroke:var(--c-nasb)} .smap .arc.r-jar{stroke:var(--c-jar)} .smap .arc.r-jazm{stroke:var(--c-jazm)}
.smap .arc.hi{stroke-width:4}
.smap .arc.dim,.smap .albl.dim{opacity:.22}
.smap .ab{fill:var(--surface);stroke:var(--ink2);stroke-width:1.3}
.smap .ab.r-raf{stroke:var(--c-raf)} .smap .ab.r-nasb{stroke:var(--c-nasb)} .smap .ab.r-jar{stroke:var(--c-jar)} .smap .ab.r-jazm{stroke:var(--c-jazm)}
.smap .al{font:700 13px Tajawal,sans-serif;fill:var(--ink)}
.smap .al.r-raf{fill:var(--c-raf)} .smap .al.r-nasb{fill:var(--c-nasb)} .smap .al.r-jar{fill:var(--c-jar)} .smap .al.r-jazm{fill:var(--c-jazm)}
.smap .ah{fill:var(--ink2)}
.smap .ah.r-raf{fill:var(--c-raf)} .smap .ah.r-nasb{fill:var(--c-nasb)} .smap .ah.r-jar{fill:var(--c-jar)} .smap .ah.r-jazm{fill:var(--c-jazm)}
.smap .tmp{fill:none;stroke:var(--gold-deep);stroke-width:3;stroke-dasharray:6 5;stroke-linecap:round}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* questions */
.sess{display:flex;flex-direction:column;gap:14px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.cnt{font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums}
.qcard{display:flex;flex-direction:column;gap:10px}
.qb{display:flex;flex-direction:column;gap:10px}
.prompt{font-weight:700;text-align:center;font-size:17px}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts1{display:flex;flex-direction:column;gap:8px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 6px;font:700 20px/1.4 Tajawal,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
.opt1{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font:500 17px/1.6 Tajawal,sans-serif;text-align:start;min-height:48px}
.opt1 .ar{font:400 22px/1.6 Amiri,serif}
.opt.k-noun{border-color:var(--noun)} .opt.k-verb{border-color:var(--verb)} .opt.k-part{border-color:var(--part)}
.opt .g{font:400 40px/1.3 Amiri,serif;color:var(--ink)}
.opt.mk span:last-child{font-size:16px}
.opt.right,.opt1.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong,.opt1.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt[disabled],.opt1[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong),.opt1[disabled]:not(.right):not(.wrong){opacity:.55}
.opt.ex.on,.opt1.ex.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.last.blank{border-bottom:3px dashed var(--gold-deep)}
.last.ok{color:var(--ok)} .last.bad{color:var(--bad)}
.hint{background:var(--surface2);border-radius:12px;padding:8px 14px;font-size:14px}
.hint summary{cursor:pointer;font-weight:700}
.hint p{margin-top:6px}
.fb{border-radius:14px;padding:12px 16px;margin-top:6px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb b{font-size:17px}
.fb div,.fb p,.fb ul{color:var(--ink);font-size:15px}
.fb ul{margin:6px 0 0;padding-inline-start:18px}
.fbh .btn{margin-top:12px;width:100%}
.parsed{display:flex;flex-direction:column;gap:4px}
.parsed div{background:var(--ok-soft);border-radius:10px;padding:4px 10px;font-size:14px}
.parsed div b{font:700 18px Amiri,serif}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.pw{font:400 26px/1.5 Amiri,serif;touch-action:none;cursor:grab}
.pw.bad{animation:shake .4s;border-color:var(--bad)}
.baskets{display:grid;gap:8px}
.bask{border:2px dashed var(--line);border-radius:14px;padding:8px 6px;min-height:130px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);cursor:pointer}
.bask b{font:700 18px/1.4 Tajawal,sans-serif}
.bask .in{display:flex;flex-direction:column;gap:4px;align-items:center;width:100%}
.bask.over{background:var(--gold-soft)}
.bask.c-noun{border-color:var(--noun)} .bask.c-verb{border-color:var(--verb)} .bask.c-part{border-color:var(--part)}
.bask.c-raf{border-color:var(--c-raf)} .bask.c-nasb{border-color:var(--c-nasb)} .bask.c-jar{border-color:var(--c-jar)} .bask.c-jazm{border-color:var(--c-jazm)}
.dragghost{position:fixed;z-index:40;pointer-events:none;opacity:.92;transform:rotate(-3deg);box-shadow:var(--shadow)}
.ans{min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;background:var(--surface)}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mbtn{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 8px;font:500 15px/1.5 Tajawal,sans-serif;min-height:48px}
.mbtn .ar{font:400 22px/1.5 Amiri,serif}
.mbtn.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.mbtn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mbtn.bad{animation:shake .4s;border-color:var(--bad)}

/* result / profile */
.res{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:8px}
.ring{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:800 32px/1 Tajawal,sans-serif}
.seal{display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .7s ease-out both}
.seal .badge{width:130px;height:130px;filter:drop-shadow(0 6px 14px rgba(209,154,31,.45))}
.seal h2{font-size:34px;color:var(--gold-deep)}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.who{display:flex;align-items:center;gap:14px}
.who .badge{width:84px;height:84px;flex:none}
.who small{color:var(--ink2)}
.who h2{font-size:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font:800 24px/1.3 Tajawal,sans-serif;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink2)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;text-align:start;width:100%}
.bitem .badge{width:52px;height:52px;flex:none}
.bitem b{display:block;font:700 17px/1.4 Amiri,serif}
.bitem small{color:var(--ink2);font-size:12px;line-height:1.4;display:block}
.bitem.off{opacity:.7}
.sharecard{background:var(--bar);color:var(--bar-ink);border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px}
.sharecard .badge{width:84px;height:84px;flex:none}
.sharecard .badge .bt{fill:var(--gold-deep)}
.sharecard b{font:700 24px/1.5 Amiri,serif;color:var(--gold);display:block}
.sharecard small{display:block;color:var(--bar-dim);line-height:1.6}
.copybox{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink);direction:ltr;font:14px monospace}
.rbar{display:flex;align-items:center;gap:8px;font-size:14px}
.rbar .lbl{width:78px;flex:none;font:700 15px Amiri,serif}
.rbar .meter{flex:1}
.rbar .v{width:38px;text-align:end;color:var(--ink2);font-variant-numeric:tabular-nums}

/* splash: a single deliberate look */
#splash{position:absolute;inset:0;z-index:20;background:#0F3B33;color:#F1F7F4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;overflow:hidden}
#splash .bgstar{position:absolute;width:150%;max-width:800px;aspect-ratio:1;opacity:.07;left:50%;top:50%;transform:translate(-50%,-50%)}
#splash .bgstar rect{fill:none;stroke:#E3B341;stroke-width:1.2}
#splash>*{position:relative}
#splash .mark{width:120px;height:120px}
#splash .mark rect{fill:none;stroke:#E3B341;stroke-width:2.4}
#splash .mark path{fill:#E3B341}
#splash h1{font:700 52px/1.3 Amiri,serif;color:#F1F7F4}
#splash p{color:#BFD8CF;font-size:18px}
#splash .go{margin-top:10px;background:#E3B341;color:#0F3B33;border:0;border-radius:16px;padding:14px 40px;font:800 19px Tajawal,sans-serif}
#splash .by{position:absolute;bottom:22px;left:0;right:0;font-size:14px;color:#BFD8CF}
#splash .by b{color:#F1F7F4}


/* ===== sarf additions ===== */
#app{--af:1}
html{-webkit-text-size-adjust:100%}
/* manual theme override */
#app[data-mode="light"]{color-scheme:light;   --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E2EBE7; --ink:#12302E; --ink2:#4B6461; --line:#CBDAD5;   --primary:#1F7A5C; --primary-ink:#FFFFFF; --primary-soft:#D6EBE2;   --gold:#D19A1F; --gold-deep:#9A6D0C; --gold-soft:#F7E8BF;   --noun:#2461A8; --noun-soft:#DCE8F7;   --verb:#B02D6B; --verb-soft:#F7DCE9;   --part:#7042B8; --part-soft:#E8DEF7;   --ok:#1B7F4B; --ok-soft:#D5F0E1; --bad:#B8401A; --bad-soft:#FBDDD1;   --c-raf:#1B7F4B; --c-raf-s:#D5F0E1;   --c-nasb:#B0680F; --c-nasb-s:#F8E6C6;   --c-jar:#0B7F90; --c-jar-s:#D3EEF2;   --c-jazm:#B23F32; --c-jazm-s:#F8DAD5;   --c-root:#0B7F90; --c-root-s:#D3EEF2; --c-zaid:#C4610A; --c-zaid-s:#FBE3CC; --c-mark:#7A45C2; --fs:1;   --bar:#0F3B33; --bar-ink:#F1F7F4; --bar-dim:#A9CDC1;   --shadow:0 1px 2px rgba(18,48,46,.08),0 8px 22px rgba(18,48,46,.09);}
#app[data-mode="dark"]{   color-scheme:dark;   --bg:#0C1918; --surface:#142624; --surface2:#1C3532; --ink:#E4F1EE; --ink2:#9DB7B2; --line:#2B4541;   --primary:#3FBF92; --primary-ink:#06231B; --primary-soft:#16382F;   --gold:#E3B341; --gold-deep:#F0CB6E; --gold-soft:#3A2F10;   --noun:#7DB2F0; --noun-soft:#16304F; --verb:#F08AB8; --verb-soft:#4A1B34; --part:#B79CF0; --part-soft:#32204F;   --ok:#52D08B; --ok-soft:#12382A; --bad:#F0845A; --bad-soft:#4A2214;   --c-raf:#52D08B; --c-raf-s:#12382A; --c-nasb:#F0B85A; --c-nasb-s:#43300F;   --c-jar:#5FCFE0; --c-jar-s:#0F3A42; --c-jazm:#F08A7C; --c-jazm-s:#4A1F1A;   --c-root:#5FCFE0; --c-root-s:#0F3A42; --c-zaid:#F5A45A; --c-zaid-s:#4A2B0F; --c-mark:#B79CF0;   --bar:#0A2622; --bar-ink:#E4F1EE; --bar-dim:#8FB3A8;   --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);}
/* morphology colour system: root = solid underline, extra = dotted underline, mark = purple */
.la{color:var(--c-root);border-bottom:3px solid var(--c-root)}
.lz{color:var(--c-zaid);border-bottom:3px dotted var(--c-zaid)}
.mk{color:var(--c-mark)}
.la .mk,.lz .mk{color:inherit}
.rw{font-family:Amiri,serif;direction:rtl;unicode-bidi:isolate}
.rz-root{color:var(--c-root);font-weight:800;letter-spacing:.15em}
#legend{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;justify-content:center;background:var(--surface);border-bottom:1px solid var(--line);padding:3px 12px;font:500 12px/1.5 Tajawal,sans-serif;color:var(--ink2)}
#legend .rw{font-size:17px;line-height:1.3}
#foot{flex:none;text-align:center;font:500 12px/1.5 Tajawal,sans-serif;color:var(--ink2);padding:3px 8px;background:var(--bg);border-top:1px solid var(--line)}
#foot b{color:var(--ink)}
.term{font:inherit;color:var(--primary);background:none;border:0;border-bottom:2px dotted var(--primary);padding:0;cursor:help;font-weight:700}
.big-sent .rw,.tile .rw{font-size:calc(30px*var(--af))}
.sent,.bigw{font-size:calc(clamp(24px,7.4vw,32px)*var(--af))}
.bigw{font-size:calc(clamp(40px,12vw,54px)*var(--af))}

/* bottom sheet */
#sheetbg{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#sheet{width:100%;max-height:82%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px 22px;box-shadow:0 -8px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:10px}
#sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);align-self:center}
#sheet h2{font-size:26px}
#sheet textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);font:16px/1.7 Tajawal,sans-serif;resize:vertical}
input.txt{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);font:400 24px/1.6 Amiri,serif;text-align:center}
input.txt:focus{border-color:var(--primary);outline:none}

/* tiles */
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.tile{min-width:52px;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:0 8px;font:400 calc(32px*var(--af))/1.9 Amiri,serif;color:var(--ink);position:relative;transition:transform .15s,border-color .15s}
.tile.a{border-color:var(--c-root);background:var(--c-root-s);color:var(--c-root)}
.tile.z{border-color:var(--c-zaid);background:var(--c-zaid-s);color:var(--c-zaid);border-style:dashed}
.tile.ok{box-shadow:0 0 0 3px var(--ok-soft)}
.tile.no{animation:shake .4s;border-color:var(--bad)}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.tile small{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font:700 10px/1.2 Tajawal,sans-serif}
.tile.ghost{opacity:.35}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:2px dashed var(--line);border-radius:14px;min-height:92px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bin b{font:700 14px/1.4 Tajawal,sans-serif}
.bin.root{border-color:var(--c-root)} .bin.zaid{border-color:var(--c-zaid)}
.bin .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bin .row span{font:700 30px/1.5 Amiri,serif;animation:drop .5s ease-out both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.rootout{font:800 clamp(30px,10vw,44px)/1.6 Amiri,serif;color:var(--c-root);text-align:center;letter-spacing:.25em}

/* balance */
.scale{position:relative;height:150px;margin:6px 0}
.scale .beam{position:absolute;top:24px;left:6%;right:6%;height:8px;border-radius:99px;background:var(--ink2);transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 50%}
.scale .post{position:absolute;top:24px;left:50%;width:10px;height:100px;margin-left:-5px;border-radius:6px;background:var(--ink2)}
.scale .base{position:absolute;bottom:0;left:30%;right:30%;height:8px;border-radius:99px;background:var(--ink2)}
.scale.bad .beam{transform:rotate(-4deg);background:var(--bad)}
.scale.good .beam{background:var(--ok)}
.pans{display:flex;gap:8px;justify-content:center;direction:rtl}
.pan{flex:1;max-width:96px;border:2px dashed var(--line);border-radius:14px;padding:4px 2px;text-align:center;background:var(--surface);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.pan .lab{font:800 26px/1.4 Amiri,serif;color:var(--c-root)}
.pan .slot{font:700 34px/1.5 Amiri,serif;min-height:52px;color:var(--ink)}
.pan.full{border-style:solid;border-color:var(--c-root);background:var(--c-root-s)}
.wazn{font:800 clamp(34px,11vw,48px)/1.7 Amiri,serif;text-align:center}
.wazn .la,.wazn .lz{animation:pop .6s ease-out both}

/* derivation tree */
.dtree{position:relative;padding:4px 0 6px}
.dtree svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dtree svg.lines path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out .2s forwards}
.dtree .seed{margin:0 auto;width:max-content;max-width:100%;background:var(--c-root-s);border:3px solid var(--c-root);border-radius:99px;padding:0 22px;font:800 clamp(34px,10vw,46px)/1.7 Amiri,serif;color:var(--c-root);letter-spacing:.2em;position:relative}
.dtree .cats{display:grid;gap:10px;margin-top:34px;position:relative}
.dtree .cat{display:flex;flex-direction:column;gap:6px;align-items:center}
.dtree .cat h4{margin:0;font:700 14px/1.4 Tajawal,sans-serif;background:var(--surface2);border-radius:99px;padding:0 12px;border:1px solid var(--line)}
.dtree .lf{width:100%;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:0 2px;font:400 clamp(20px,5.6vw,25px)/1.7 Amiri,serif;text-align:center;opacity:0;animation:leaf .5s ease-out forwards}
.dtree .lf.on{border-color:var(--gold);background:var(--gold-soft)}
@keyframes leaf{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}

/* factory */
.fpick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fpick .btn{min-height:44px;padding:4px 14px;font:700 22px/1.5 Amiri,serif}
.fout{background:var(--surface2);border-radius:16px;padding:8px;text-align:center}

/* grid table */
.cg{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.cg table{border-collapse:collapse;width:100%;min-width:0}
.cg th,.cg td{padding:3px 3px;border-bottom:1px solid var(--line);text-align:center;font:400 calc(19px*var(--af))/1.8 Amiri,serif}
.cg th{background:var(--surface2);font:700 14px/1.5 Tajawal,sans-serif;white-space:nowrap}
.cg td:first-child{font:700 14px/1.5 Amiri,serif;background:var(--surface2);white-space:nowrap}
.cg tr.on td{background:var(--gold-soft)}
.cg tr{cursor:pointer}

/* reader */
.rd{font:400 calc(clamp(26px,7.6vw,34px)*var(--af))/2.3 Amiri,serif;text-align:center;display:flex;flex-wrap:wrap;gap:0 10px;justify-content:center}
.rd button{font:inherit;background:none;border:0;border-bottom:3px solid transparent;border-radius:6px;padding:0 4px;color:var(--ink)}
.rd button.k-noun{color:var(--noun)} .rd button.k-verb{color:var(--verb)} .rd button.k-part{color:var(--part)}
.rd button.on{background:var(--gold-soft);border-bottom-color:var(--gold)}

.al-st{background:var(--surface2);border-radius:12px;padding:8px 12px;animation:leaf .4s ease-out both}
.tiles2{display:inline-flex;gap:3px;direction:rtl}.tiles2 i{font:700 18px Amiri,serif;font-style:normal;border:1.5px solid var(--line);border-radius:8px;padding:0 6px;background:var(--surface)}
.al-res{background:var(--ok-soft);border:2px solid var(--ok);border-radius:14px;padding:10px;text-align:center;animation:pop .5s}
.al-word{font:700 calc(46px*var(--af))/1.5 Amiri,serif}.al-word b.sa{color:var(--hA)}.al-word b.sy{color:var(--hY)}
/* التاء */
.ta-word{font:700 calc(48px*var(--af))/1.5 Amiri,serif;text-align:center}
.ta-word .slot{color:var(--gold);border-bottom:3px dashed var(--gold);padding:0 6px}
.ta-stage{display:grid;gap:8px;text-align:center}
/* التوالي */
.tw-row{display:flex;align-items:center;justify-content:center;gap:14px;font:700 calc(40px*var(--af))/1.6 Amiri,serif;background:var(--surface2);border-radius:18px;padding:12px}
.tw-row .tw-b{opacity:.15;transition:opacity .6s}.tw-row.go .tw-b{opacity:1}
.tw-row.go .tw-a{color:var(--ink2);text-decoration:line-through}
.tw-ar{color:var(--ink2);font-size:24px}
/* رسوم */
.il .hzbig{font-size:64px;fill:var(--primary)}
.il .xl{font-size:64px}.il .gold{fill:var(--gold)}
.il .w1{animation:ear 1.8s infinite}.il .w2{animation:ear 1.8s infinite .4s}
.il .zz{stroke-dasharray:4 4}
.il .gone{fill:var(--bad);opacity:.35}
.il .bridge path{stroke:var(--primary);stroke-width:5}
.il .tw1{animation:twA 3s ease-in-out infinite}.il .tw2{animation:twB 3s ease-in-out infinite}.il .tw3{opacity:0;animation:twC 3s ease-in-out infinite}
@keyframes twA{0%,20%{transform:none;opacity:1}55%,100%{transform:translateX(40px);opacity:0}}
@keyframes twB{0%,20%{transform:none;opacity:1}55%,100%{transform:translateX(-40px);opacity:0}}
@keyframes twC{0%,45%{opacity:0;transform:scale(.6)}65%,90%{opacity:1;transform:none}100%{opacity:0}}
.il .tw3{transform-box:fill-box;transform-origin:center}
.il .sign{animation:beat2 2s infinite}
.il .root{stroke:var(--ok)}
.il .lrung{animation:leaf .6s ease-out both}
.il .fade{opacity:.85}

/* ===== شبكة الهمزة ===== */
.hn-wrap{position:relative;background:var(--surface2);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;gap:14px;align-items:center;min-height:180px}
.hn-svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.hn-ln{fill:none;stroke:var(--ink2);stroke-width:2.5;stroke-dasharray:600;stroke-dashoffset:600;animation:draw2 .7s ease-out forwards}
@keyframes draw2{to{stroke-dashoffset:0}}
.hn-ln.lh{stroke:var(--primary)}.hn-ln.lp{stroke:var(--cs)}.hn-ln.lw{stroke:var(--gold);stroke-width:3}.hn-ln.lc{stroke:var(--gold);stroke-width:3.5;stroke-dasharray:6 5;animation:none}
.hn-ln.dead{stroke-dasharray:4 6;opacity:.5;animation:none}
.hn-pos{z-index:1}.hn-tag{display:inline-block;border:2px dashed var(--line);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px;color:var(--ink2)}
.hn-tag.on{border-style:solid;border-color:var(--primary);color:var(--primary);background:var(--surface)}
.hn-row{display:flex;gap:4px;direction:rtl;justify-content:center;flex-wrap:wrap;z-index:1}
.hn-l{min-width:40px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;font:700 calc(26px*var(--af))/1 Amiri,serif;padding:0 4px}
.hn-l.hz0{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 20%,transparent);animation:pulse 1.8s infinite}
.hn-l.prv{border-color:var(--cs);color:var(--cs)}
.hn-gap{width:14px}
.hn-chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;direction:rtl;z-index:1;min-height:10px}
.hn-chip{border-radius:12px;padding:4px 10px;font-size:14px;background:var(--surface);border:2px solid;animation:pop .35s}
.hn-chip.ch-h{border-color:var(--primary)}.hn-chip.ch-p{border-color:var(--cs)}.hn-chip.off{opacity:.55;text-decoration:line-through}
.hn-mid{z-index:1;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.hn-ask{display:flex;flex-direction:column;gap:6px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 10px;border:1.5px solid var(--line)}
.hn-win{background:var(--surface);border:2px dashed var(--gold);border-radius:14px;padding:6px 12px;font-size:15px;animation:pop .35s}
.hn-win.on{border-style:solid;background:var(--gold-soft)}
.hn-join{font:700 30px Amiri,serif;display:inline-flex;align-items:center;gap:2px;margin:0 6px}.hn-join i{font-style:normal;color:var(--gold)}
.hn-chairs{width:100%;z-index:1}
.hn-chairs .ch.bad rect,.hn-chairs .ch.bad path{stroke:var(--bad);fill:var(--bad)}
.hn-final{font:700 calc(44px*var(--af))/1.5 Amiri,serif;animation:pop .5s}
.btn.wrong{border-color:var(--bad)!important;color:var(--bad)}
/* اكتشف */
.dc-bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.dc-bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.dc-card{background:var(--surface2);border-radius:18px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;animation:leaf .35s}
.dc-n{font-size:13px;color:var(--ink2);font-weight:700}
.dc-sp{font:700 calc(36px*var(--af))/1.4 Amiri,serif}
.dc-opts{display:flex;gap:10px;justify-content:center;direction:rtl}
.dc-o{width:62px;height:62px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font:700 34px Amiri,serif;color:var(--ink)}
.dc-o.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.dc-o.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .3s}
.dc-w{font:700 calc(32px*var(--af))/1.4 Amiri,serif;animation:pop .4s}
.dc-groups{display:grid;gap:6px;width:100%}.dc-g{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border-radius:12px;padding:6px 10px;font-size:20px}
.dc-seat{font-size:26px}
.dc-rule{background:var(--gold-soft);border:2px solid var(--gold);border-radius:14px;padding:10px 12px;animation:pop .5s}
/* هل يتصل */
.cn-row{display:flex;direction:rtl;justify-content:center;align-items:center;font:700 calc(48px*var(--af))/1.5 Amiri,serif;gap:0;transition:gap .5s;background:var(--surface2);border-radius:18px;padding:8px}
.cn-row.apart{gap:22px}.cn-row.apart .cn-p{color:var(--cs)}.cn-row.joined .cn-p{color:var(--ok)}
.cn-q{color:var(--primary)}.cn-a{color:var(--ink2)}
.cn-stage{display:flex;flex-direction:column;gap:8px;text-align:center}
.cn-fin{animation:pop .5s}
.cn-b.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.cn-b.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
/* القوائم المكشوفة تدريجياً */
.rv-b{display:flex;gap:8px;flex-wrap:wrap}
ul.rv li.pop{animation:leaf .4s ease-out}
.hw[data-ph]{cursor:pointer;border-bottom:1.5px dotted color-mix(in srgb,var(--primary) 60%,transparent)}
/* مصنع الكلمات: ربط ألوانه بألوان البرنامج (فيتبع المظهر الفاتح والداكن) */
.wf{--wf-bg:var(--bg);--wf-surface:var(--surface);--wf-surface2:var(--surface2);--wf-ink:var(--ink);--wf-muted:var(--ink2);--wf-line:var(--line);
  --wf-accent:var(--primary);--wf-accent-ink:var(--primary-ink);--wf-gold:var(--gold);--wf-ok:var(--ok);--wf-bad:var(--bad);
  --wf-sA:var(--hA);--wf-sW:var(--hW);--wf-sY:var(--hY);--wf-sL:var(--hL);--wf-sM:var(--hD);--wf-sLy:var(--primary);
  --wf-word:Amiri,"Noto Naskh Arabic",serif;--wf-ui:Tajawal,"Segoe UI",sans-serif}
.wfcard{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* مصنع الكلمات — أنماط محصورة في .wf وتقرأ ألوانها من متغيرات --wf-* (تُعرَّف في الصفحة المستقلة أو تُربط بألوان البرنامج) */
.wf{display:flex;flex-direction:column;gap:14px;color:var(--wf-ink);font-family:var(--wf-ui)}
.wf *{box-sizing:border-box}
.wf [hidden]{display:none!important}
.wf>*{min-width:0}
.wf .wf-tabs{display:flex;gap:6px;background:var(--wf-surface2);padding:4px;border-radius:12px}
.wf .wf-tabs button{flex:1;border:0;background:transparent;color:var(--wf-ink);font:700 15px var(--wf-ui);padding:9px 6px;border-radius:9px;cursor:pointer}
.wf .wf-tabs button[aria-selected="true"]{background:var(--wf-surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.wf .wf-tabs .wf-n{font-weight:500;color:var(--wf-muted)}
.wf button:focus-visible{outline:2px solid var(--wf-accent);outline-offset:2px}
.wf .wf-lbl{font-size:13px;font-weight:700;color:var(--wf-muted);letter-spacing:.02em;margin:0 0 6px}
.wf .wf-ctrls{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.wf .wf-ctrls>*{min-width:0}
.wf .wf-rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.wf .wf-rhead .wf-lbl{margin:0}
.wf .wf-rsearch{flex:1 1 140px;max-width:220px;font:500 15px var(--wf-ui);color:var(--wf-ink);background:var(--wf-surface);border:1.5px solid var(--wf-line);border-radius:10px;padding:5px 10px}
.wf .wf-rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.wf .wf-root{flex:none;border:1.5px solid var(--wf-line);background:var(--wf-surface);color:var(--wf-ink);border-radius:12px;padding:6px 12px;cursor:pointer;text-align:center;min-width:76px}
.wf .wf-root b{display:block;font:700 22px/1.4 var(--wf-word);letter-spacing:.12em}
.wf .wf-root small{display:block;font-size:12px;color:var(--wf-muted);white-space:nowrap}
.wf .wf-root[aria-pressed="true"]{border-color:var(--wf-accent);background:color-mix(in srgb,var(--wf-accent) 12%,var(--wf-surface))}
.wf .wf-root:disabled{opacity:.4;cursor:default}
.wf .wf-rnone{color:var(--wf-muted);font-size:14px;padding:8px 0}
.wf .wf-chips{display:flex;flex-wrap:wrap;gap:6px}
.wf .wf-chip{border:1.5px solid var(--wf-line);background:var(--wf-surface);color:var(--wf-ink);border-radius:999px;padding:4px 12px;cursor:pointer;font:600 15px var(--wf-ui);display:inline-flex;align-items:baseline;gap:6px}
.wf .wf-chip .wf-w{font:700 19px/1.5 var(--wf-word)}
.wf .wf-chip .wf-z{font-size:12px;color:var(--wf-muted);font-weight:500}
.wf .wf-chip[aria-pressed="true"]{background:var(--wf-accent);border-color:var(--wf-accent);color:var(--wf-accent-ink)}
.wf .wf-chip[aria-pressed="true"] .wf-z{color:inherit;opacity:.85}
.wf .wf-stage{background:var(--wf-surface);border:1px solid var(--wf-line);border-radius:18px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.wf .wf-word{font:700 clamp(44px,12vw,72px)/1.5 var(--wf-word);text-align:center;min-height:1.5em;position:relative;overflow-wrap:anywhere}
.wf .wf-hz{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:12px}
.wf .wf-hz.wf-sA{color:var(--wf-sA)}.wf .wf-hz.wf-sW{color:var(--wf-sW)}.wf .wf-hz.wf-sY{color:var(--wf-sY)}.wf .wf-hz.wf-sL{color:var(--wf-sL)}.wf .wf-hz.wf-sM{color:var(--wf-sM)}.wf .wf-hz.wf-sLy{color:var(--wf-sLy)}
.wf .wf-hz.wf-jump{animation:wfjump .6s ease-out}
@keyframes wfjump{0%,35%{color:var(--wf-gold)}100%{}}
.wf .wf-ghost{position:absolute;font:700 34px/1 var(--wf-word);color:var(--wf-muted);pointer-events:none;animation:wfghost .9s ease-out forwards}
@keyframes wfghost{from{opacity:.9;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}
.wf .wf-q{display:inline-block;border:2.5px dashed var(--wf-gold);border-radius:10px;padding:0 .12em;line-height:1.1;color:var(--wf-gold)}
.wf .wf-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.wf .wf-piece{font-size:13px;font-weight:700;border-radius:6px;padding:3px 9px;background:var(--wf-surface2);color:var(--wf-muted);border:1px solid var(--wf-line)}
.wf .wf-piece.wf-main{background:color-mix(in srgb,var(--wf-accent) 14%,var(--wf-surface));color:var(--wf-ink)}
.wf .wf-ctl-in{border-block:1px solid var(--wf-line);padding-block:10px;gap:10px}
.wf .wf-ctl-in .wf-lbl{margin-bottom:4px}
.wf .wf-seg{display:flex;flex-wrap:wrap;gap:6px}
.wf .wf-seg button{border:1.5px solid var(--wf-line);background:var(--wf-surface);color:var(--wf-ink);border-radius:10px;padding:6px 12px;font:700 15px var(--wf-ui);cursor:pointer;min-width:3em}
.wf .wf-seg button[aria-pressed="true"]{border-color:var(--wf-accent);background:color-mix(in srgb,var(--wf-accent) 14%,var(--wf-surface))}
.wf .wf-seg button:disabled{opacity:.35;cursor:not-allowed}
.wf .wf-note{font-size:13px;color:var(--wf-muted);margin:2px 0 0}
.wf .wf-race{display:grid;gap:8px;background:var(--wf-surface2);border-radius:12px;padding:12px}
.wf .wf-race h3{margin:0;font-size:14px;color:var(--wf-muted)}
.wf .wf-lane{display:grid;grid-template-columns:7.5em 1fr 4.2em;align-items:center;gap:8px;font-size:14px}
.wf .wf-lane .wf-bar{height:12px;background:var(--wf-surface);border-radius:99px;overflow:hidden;border:1px solid var(--wf-line)}
.wf .wf-lane .wf-bar i{display:block;height:100%;background:var(--wf-muted);border-radius:99px;transition:width .45s ease}
.wf .wf-lane.wf-win .wf-bar i{background:var(--wf-gold)}
.wf .wf-lane.wf-win b{color:var(--wf-gold)}
.wf .wf-lane span:last-child{text-align:left;color:var(--wf-muted)}
.wf .wf-verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.wf .wf-seat{display:inline-flex;align-items:center;justify-content:center;min-width:2.1em;height:2.1em;border-radius:10px;font:700 24px/1 var(--wf-word);color:#fff;padding:0 .3em}
.wf .wf-seat.wf-sA{background:var(--wf-sA)}.wf .wf-seat.wf-sW{background:var(--wf-sW)}.wf .wf-seat.wf-sY{background:var(--wf-sY)}.wf .wf-seat.wf-sL{background:var(--wf-sL)}.wf .wf-seat.wf-sM{background:var(--wf-sM)}.wf .wf-seat.wf-sLy{background:var(--wf-sLy)}
.wf .wf-why{margin:0;font-size:15px;line-height:1.8;max-width:65ch}
.wf .wf-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wf .wf-btn{border:1.5px solid var(--wf-line);background:var(--wf-surface);color:var(--wf-ink);border-radius:12px;padding:10px 16px;font:700 15px var(--wf-ui);cursor:pointer}
.wf .wf-btn.wf-pri{background:var(--wf-accent);border-color:var(--wf-accent);color:var(--wf-accent-ink)}
.wf .wf-btn:disabled{opacity:.45;cursor:default}
.wf .wf-switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;font-size:15px}
.wf .wf-switch input{width:20px;height:20px;accent-color:var(--wf-accent)}
.wf .wf-pred{display:grid;gap:8px}
.wf .wf-pred .wf-opts{display:flex;flex-wrap:wrap;gap:8px}
.wf .wf-pred .wf-opts button{font:700 26px/1 var(--wf-word);width:2.2em;height:2.2em;border-radius:12px;border:1.5px solid var(--wf-line);background:var(--wf-surface);color:var(--wf-ink);cursor:pointer}
.wf .wf-pred .wf-opts button.wf-right{background:var(--wf-ok);border-color:var(--wf-ok);color:#fff}
.wf .wf-pred .wf-opts button.wf-wrong{background:var(--wf-bad);border-color:var(--wf-bad);color:#fff}
.wf .wf-score{font-weight:700;color:var(--wf-muted)}
.wf .wf-puz{border:2px solid var(--wf-gold);background:color-mix(in srgb,var(--wf-gold) 8%,var(--wf-surface));border-radius:16px;padding:14px;display:grid;gap:8px}
.wf .wf-puz .wf-k{font-size:13px;font-weight:800;color:var(--wf-gold);letter-spacing:.03em}
.wf .wf-puz .wf-t{font:700 22px/1.6 var(--wf-word);margin:0;text-wrap:balance}
.wf .wf-fb{border-radius:12px;padding:10px 12px;font-size:15px}
.wf .wf-fb.wf-ok{background:color-mix(in srgb,var(--wf-ok) 14%,var(--wf-surface));border:1px solid var(--wf-ok)}
.wf .wf-fb.wf-no{background:color-mix(in srgb,var(--wf-bad) 12%,var(--wf-surface));border:1px solid var(--wf-bad)}
.wf .wf-fb.wf-hint{background:var(--wf-surface2)}
.wf .wf-dots{display:flex;gap:5px;flex-wrap:wrap}
.wf .wf-dots i{width:10px;height:10px;border-radius:50%;background:var(--wf-line)}
.wf .wf-dots i.wf-done{background:var(--wf-ok)}.wf .wf-dots i.wf-cur{background:var(--wf-gold)}
.wf .wf-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.wf .wf-pin{background:var(--wf-surface);border:1px solid var(--wf-line);border-radius:14px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.wf .wf-pin .wf-pw{font:700 34px/1.5 var(--wf-word);text-align:center;overflow-wrap:anywhere}
.wf .wf-pin .wf-pp{display:flex;flex-wrap:wrap;gap:4px}
.wf .wf-pin .wf-pp span{font-size:12px;border-radius:5px;padding:1px 7px;background:var(--wf-surface2);color:var(--wf-muted)}
.wf .wf-pin .wf-pp span.wf-diff{background:color-mix(in srgb,var(--wf-gold) 22%,var(--wf-surface));color:var(--wf-ink);font-weight:700}
.wf .wf-pin .wf-pr{font-size:13px;color:var(--wf-muted);margin:0;line-height:1.6}
.wf .wf-pin .wf-x{justify-self:start;border:0;background:none;color:var(--wf-muted);cursor:pointer;font:600 13px var(--wf-ui);padding:0}
.wf .wf-legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:13px;color:var(--wf-muted)}
.wf .wf-legend span b{font:700 18px var(--wf-word);margin-inline-end:4px}
.wf .wf-legend .wf-cA{color:var(--wf-sA)}.wf .wf-legend .wf-cW{color:var(--wf-sW)}.wf .wf-legend .wf-cY{color:var(--wf-sY)}.wf .wf-legend .wf-cL{color:var(--wf-sL)}.wf .wf-legend .wf-cM{color:var(--wf-sM)}
.wf .wf-empty{color:var(--wf-muted);font-size:15px;background:var(--wf-surface);border:1px dashed var(--wf-line);border-radius:14px;padding:16px}
@media (prefers-reduced-motion:reduce){.wf .wf-hz.wf-jump,.wf .wf-ghost{animation:none}.wf .wf-lane .wf-bar i{transition:none}}
@media (max-width:420px){.wf .wf-lane{grid-template-columns:6.4em 1fr 3.6em;font-size:13px}}


/* ================= التكيّف مع حجم الشاشة =================
   الهاتف (أقل من ٧٠٠): عمود واحد وشريط تنقّل سفلي.
   اللوحي (٧٠٠–١٠٩٩): يملأ الشاشة، والمحتوى في الوسط بعرض قراءة مريح، وشبكات بثلاثة أعمدة.
   الحاسوب (١١٠٠ فأكثر): شريط تنقّل جانبي فيه اسم التطبيق، والمحتوى في الوسط. */
@media (min-width:700px){
  #app{max-width:none;border-inline:0}
  #view{padding-inline:max(24px,calc((100% - 840px)/2));padding-block:22px 36px;gap:18px}
  #lvbar{padding-inline:max(20px,calc((100% - 880px)/2))}
  #tabs{padding-inline:max(10px,calc((100% - 640px)/2))}
  .tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tgrid>:last-child:nth-child(3n+1){grid-column:1/-1}
  #sheetbg{justify-content:center}
  #sheet{max-width:680px}
}
@media (min-width:1100px){
  #app{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"nav bar" "nav legend" "nav view"}
  #lvbar{grid-area:bar;padding-inline:max(28px,calc((100% - 920px)/2))}
  #legend{grid-area:legend}

<script type="application/json" id="d-gloss">[{"t":"الهمزة","d":"حرف من حروف الهجاء يُنطق من أقصى الحلق، يقبل الحركات والسكون، ويأتي في أول الكلمة ووسطها وآخرها. لها صور في الكتابة: أ، إ، ؤ، ئ، ء، آ.","ex":"⟦سُءَال⟧"},{"t":"الألف","d":"حرف مدّ ساكن دائماً، مفتوح ما قبله، لا يأتي في أول الكلمة ولا يقبل الحركات.","ex":"قَالَ"},{"t":"همزة الوصل","d":"همزة زائدة تُنطق في أول الكلام وتسقط في درجه (وسطه)، وتُكتب ألفاً مجرّدة بلا رأس: ا. مواضعها: ال، أمر الثلاثي، ماضي الخماسي والسداسي وأمرهما ومصدرهما، والأسماء العشرة.","ex":"اسْتَخْرَجَ"},{"t":"همزة القطع","d":"همزة تُنطق في كل حال، في أول الكلام ووسطه، وتُكتب برأس: فوق الألف مع الفتح والضم (أ)، وتحتها مع الكسر (إ).","ex":"أَكْرَمَ، إِكْرَام"},{"t":"الأسماء العشرة","d":"أسماء همزتها همزة وصل على خلاف الأصل في الأسماء: اسم، ابن، ابنة، ابنم، امرؤ، امرأة، اثنان، اثنتان، است، ايمُن."},{"t":"الدَّرْج","d":"وصل الكلام بعضه ببعض دون وقف؛ وفيه تسقط همزة الوصل نطقاً."},{"t":"الهمزة المتوسطة","d":"الهمزة التي تقع في وسط الكلمة، وتُكتب بحسب أقوى الحركتين: حركتها وحركة ما قبلها، مع حالات خاصة.","ex":"⟦مَسْءَلَة⟧"},{"t":"الهمزة المتطرفة","d":"الهمزة التي تقع في آخر الكلمة، ويُنظر في رسمها إلى حركة ما قبلها فقط.","ex":"⟦شَاطِء⟧"},{"t":"أقوى الحركتين","d":"قاعدة الهمزة المتوسطة: تُقارن حركتها بحركة ما قبلها، وترتيب القوة: الكسرة ثم الضمة ثم الفتحة ثم السكون؛ فالكسرة للنبرة (ئ)، والضمة للواو (ؤ)، والفتحة للألف (أ)."},{"t":"النبرة","d":"سنّ صغيرة كالياء غير المنقوطة تجلس عليها الهمزة: ئ. وتُسمى الكرسي أيضاً."},{"t":"الهمزة على السطر","d":"الهمزة المفردة التي لا تجلس على حرف: ء.","ex":"⟦سَمَاء⟧"},{"t":"المدّة","d":"علامة «آ» تُكتب حين تجتمع همزة مفتوحة وألف مدّ بعدها، أو همزتان أولاهما مفتوحة والثانية ساكنة.","ex":"⟦قُرْءَان⟧"},{"t":"توالي الأمثال","d":"اجتماع حرفين متشابهين في الخط، كألفين أو واوين؛ وتكره الكتابة العربية ذلك، فتُدمج الألفان مدّةً، وتُكتب الهمزة أحياناً على السطر أو النبرة فراراً من واوين."},{"t":"ألف تنوين النصب","d":"ألف تُزاد بعد تنوين الفتح في آخر الاسم المنصوب، إلا إذا كان آخره تاء مربوطة أو همزة على ألف أو همزة بعد ألف.","ex":"⟦جُزْءً⟧، ⟦مَبْدَءً⟧، ⟦سَمَاءً⟧"},{"t":"الحرف الذي يتصل بما بعده","d":"كل حروف الهجاء تتصل بما بعدها إلا ستة: ا، د، ذ، ر، ز، و. ويؤثر ذلك في رسم الهمزة بعد الساكن مع ألف التنوين أو التثنية: شيئًا وجزءًا."},{"t":"السابقة","d":"حرف أو أكثر يدخل على أول الكلمة: حروف الجر (بِ، لِ، كَ)، والعطف (وَ، فَ)، والسين، وال، وهمزة الاستفهام؛ ولا تغيّر حكم الهمزة الأولى غالباً.","ex":"⟦بِ+ءَنَّ⟧"},{"t":"اللاحقة","d":"ما يتصل بآخر الكلمة: الضمائر (ـه، ـكم)، وألف الاثنين، وواو الجماعة، وعلامات التثنية والجمع. وقد تجعل الهمزة المتطرفة متوسطة.","ex":"⟦ءَبْنَاء|ُكُمْ⟧"},{"t":"الألف اللينة","d":"ألف ساكنة مفتوح ما قبلها تقع في آخر الكلمة، وتُكتب قائمة (ا) أو مقصورة على صورة الياء غير المنقوطة (ى).","ex":"دَعَا، رَمَى"},{"t":"الألف المقصورة","d":"الألف التي تُكتب على صورة الياء بلا نقط: ى.","ex":"مُسْتَشْفَى"},{"t":"الألف القائمة","d":"الألف التي تُكتب عموداً: ا. وتُسمى الممدودة أيضاً.","ex":"عَصَا"},{"t":"أصل الألف","d":"الحرف الذي انقلبت عنه الألف في الثلاثي: واو أو ياء. ويُعرف بالمضارع أو المصدر أو المثنى أو الجمع أو إسناد الفعل إلى الضمير.","ex":"دعا يدعو، رمى يرمي"},{"t":"التاء المربوطة","d":"تاء تُنطق هاءً عند الوقف وتاءً عند الوصل، وتُكتب: ة. تكون في آخر الأسماء فقط.","ex":"شَجَرَة"},{"t":"التاء المفتوحة","d":"تاء تُنطق تاءً في الوقف والوصل، وتُكتب: ت. تكون في الأفعال والحروف وبعض الأسماء وجمع المؤنث السالم.","ex":"بَنَات، كَتَبَتْ"},{"t":"الهاء","d":"حرف أصلي أو ضمير، يُنطق هاءً في الوقف والوصل، ولا تتصل به نقطتان.","ex":"وَجْه، كِتَابُه"},{"t":"الوقف","d":"قطع النطق عند آخر الكلمة؛ وفيه تُنطق التاء المربوطة هاءً.","ex":"شَجَرَهْ"},{"t":"الممنوع من الصرف","d":"اسم لا يُنوَّن، ويُجرّ بالفتحة إلا إذا أُضيف أو عُرّف بأل، مثل «أصدقاء» و«أطبّاء»."},{"t":"الرسم القياسي","d":"الرسم الذي يطّرد مع القواعد العامة، وعليه أكثر المناهج والمعاجم الحديثة، مثل «مسؤول» و«يقرؤون»."},{"t":"المدرسة المصرية","d":"عُرف كتابي شائع في المطبوعات المصرية وكتب التراث المحققة، يكره توالي واوين فيكتب «مسئول، شئون، يقرءون، رءوس»."},{"t":"رسم المصحف","d":"الرسم العثماني الذي كُتب به المصحف، وله قواعده الخاصة؛ يُلتزم في كتابة القرآن ولا يُقاس عليه في الكتابة المعتادة."},{"t":"الألف الفارقة","d":"ألف تُزاد بعد واو الجماعة المتطرفة في الأفعال للتفريق بينها وبين الواو الأصلية.","ex":"كَتَبُوا، لَمْ يَكْتُبُوا"},{"t":"واو عمرو","d":"واو تُكتب ولا تُنطق في «عمرو» للتفريق بينه وبين «عُمَر»، وتُحذف في النصب المنوّن: رأيتُ عمرًا."}]</script>

      if(!hh){n.warn='لم تُشكَّل الهمزة الأولى؛ افترضتُ أنها مفتوحة.';}
      if(t.sep==='+'){n.pref=true;}
      /* همزتان: الثانية ساكنة تُقلب مدّاً */
      if(N&&N.c==='ء'&&N.h==='o'&&!N.sep){N.done=true;if(hh==='a'||!hh){n.seat='آ';n.merge=true;n.rule='i-twin-a';N.drop=true;}else if(hh==='u'){N.repl='و';n.rule='i-twin-u';}else{N.repl='ي';n.rule='i-twin-i';}}
      else if(N&&N.c==='ا'&&!N.h&&!N.sep&&(hh==='a'||!hh)){n.seat='آ';n.merge=true;n.rule='i-madd';}

    else if(final&&!(sufStart&&N.c!=='ا')){
      n.pos='f';

      if(ph==='a'){n.seat='أ';n.rule='f-a';}else if(ph==='u'){n.seat='ؤ';n.rule='f-u';}else if(ph==='i'){n.seat='ئ';n.rule='f-i';}
      else{n.seat='ء';n.rule=P&&P.c==='ا'?'f-alif':(P&&(P.c==='و'||P.c==='ي')&&!P.h?'f-madd':'f-sukun');}

        else{n.tnRule=ext==='tn'?'tn-wy':'suf-wy';n.addAlif=ext==='tn';}

      if(!hh){n.warn='لم تُشكَّل الهمزة؛ افترضتُ أنها مفتوحة.';hh='a';}
      if(hh==='i'){n.seat='ئ';n.rule='m-i';}
      else if(P&&P.c==='ي'&&ph==='o'){n.seat='ئ';n.rule='m-ya';}
      else if(P&&P.c==='ا'){if(hh==='a'){n.seat='ء';n.rule='m-alif-a';}else if(hh==='u'){n.seat='ؤ';n.rule='m-alif-u';}else{n.seat=SEAT[ph==='o'?'a':ph]||'أ';n.rule='m-strong';}}
      else if(P&&P.c==='و'&&ph==='o'&&(!P.h||hh==='u'||n.pos==='fm')){if(hh==='a'){n.seat='ء';n.rule='m-waw-a';}else{n.seat='ء';n.rule='m-waw-u';n.altSeat='ؤ';n.altSchool='qiyas';}}
      else if(P&&P.c==='و'&&P.h==='o'&&hh==='a'){n.seat='أ';n.rule='m-lin';n.altSeat='ء';n.altSchool='wline';}
      else{
        if(!ph){n.warn='لم يُشكَّل الحرف الذي قبل الهمزة؛ افترضتُ أنه ساكن.';ph='o';}
        var w=RANK[hh]>=RANK[ph]?hh:ph;n.win=w;n.ph=ph;

      if(n.seat==='ؤ'&&N&&N.c==='و'&&(!N.h||N.h==='o')){n.rule2='twin-waw';n.altSeat=connects(P&&P.c)?'ئ':'ء';n.altSchool='egy';if(n.pos==='fm'&&ph==='a'){n.alt2='أ';}}

function sufText(T,a,b){var s='';for(var i=a;i<=b;i++){s+=T[i].c;}return s;}
/* بناء النص من التحليل: يعيد النص (مشكولاً أو مجرّداً) ومواضع الهمزات في النص المجرّد */
function render(A,choice,plain){
  choice=choice||{};
  var T=A.T,out='',pl=0,pos={},byK={},skip={};A.notes.forEach(function(n){byK[n.k]=n;});
  for(var k=0;k<T.length;k++){
    var t=T[k];if(t.drop||skip[k]){continue;}
    if(t.sp){out+=' ';pl++;continue;}
    var n=byK[k],c=t.c,h=t.h,tn=t.tn,sh=t.sh,extra='';
    if(c==='ٱ'){c='ا';h=null;}
    if(t.repl){c=t.repl;h=null;}
    if(n){
      var seat=n.seat,merge=n.merge;
      if(choice[k]==='alt'&&n.altSeat){seat=n.altSeat;merge=!!n.altMerge;}
      else if(choice[k]&&choice[k]!=='alt'){seat=choice[k];merge=seat==='آ'&&T[k+1]&&T[k+1].c==='ا';}
      var addA=n.addAlif;if(choice['tn'+k]!=null){addA=choice['tn'+k];}
      c=seat;if(merge){h=null;if(T[k+1]&&T[k+1].c==='ا'){skip[k+1]=1;}}
      if(addA){extra='ا';}
      pos[k]=pl;
    }
    out+=c;pl++;
    if(!plain){if(sh){out+=SH;}if(tn){out+=TC[tn];}else if(h){out+=HC[h];}}
    if(extra){out+=extra;pl++;}
  }
  return {s:out,pos:pos};
}

function why(n){
  var s='',seat=SEATN[n.seat]||n.seat;
  switch(n.rule){
    case 'i-fath':s='همزة في أول الكلمة'+(n.pref?' (دخلت عليها سابقة فبقيت في حكم الأولى)':'')+'، وهي '+HN[n.hh||'a']+'؛ والهمزة الأولى تُكتب على الألف دائماً، فوقها مع الفتح والضم: أ.';break;
    case 'i-kasr':s='همزة في أول الكلمة'+(n.pref?' (دخلت عليها سابقة فبقيت في حكم الأولى)':'')+'، وهي مكسورة؛ فتُكتب تحت الألف: إ.';break;
    case 'i-madd':s='همزة مفتوحة بعدها ألف مدّ في أول الكلمة (وأصلها في مثل «آمن، آثر» همزتان: أَأْمَنَ)؛ تجتمع الألفان فتُكتبان مدّة: آ.';break;
    case 'i-twin-a':s='همزتان: الأولى مفتوحة والثانية ساكنة، فتُقلب الثانية ألفاً وتُكتبان مدّة: آ (أَأْمَنَ ← آمَنَ).';break;
    case 'i-twin-u':s='همزتان: الأولى مضمومة والثانية ساكنة، فتُقلب الثانية واواً: أُؤْمِن ← أُومِن.';break;
    case 'i-twin-i':s='همزتان: الأولى مكسورة والثانية ساكنة، فتُقلب الثانية ياء: إِئْمَان ← إِيمَان.';break;
    case 'f-a':s='همزة متطرفة قبلها فتحة؛ فتُكتب على حرف يناسب حركة ما قبلها: الألف (أ).';break;
    case 'f-u':s='همزة متطرفة قبلها ضمة؛ فتُكتب على الواو (ؤ).';break;
    case 'f-i':s='همزة متطرفة قبلها كسرة؛ فتُكتب على النبرة (ئ).';break;
    case 'f-alif':s='همزة متطرفة قبلها ألف ساكنة؛ فتُكتب مفردة على السطر (ء).';break;
    case 'f-madd':s='همزة متطرفة قبلها حرف مدّ ساكن؛ فتُكتب مفردة على السطر (ء).';break;
    case 'f-sukun':s='همزة متطرفة قبلها حرف ساكن؛ فتُكتب مفردة على السطر (ء).';break;
    case 'm-i':s='همزة متوسطة مكسورة؛ والكسرة أقوى الحركات، فتُكتب على النبرة (ئ) أياً كان ما قبلها.';break;
    case 'm-ya':s='همزة متوسطة قبلها ياء ساكنة؛ فتُكتب على النبرة (ئ) دائماً (هَيْئَة، بِيئَة).';break;
    case 'm-alif-a':s='همزة متوسطة مفتوحة بعد ألف؛ فتُكتب مفردة على السطر (ء) كراهة توالي ألفين في الخط.';break;
    case 'm-alif-u':s='همزة متوسطة مضمومة بعد ألف؛ فتُكتب على الواو (ؤ).';break;
    case 'm-waw-a':s='همزة متوسطة مفتوحة بعد واو ساكنة'+(n.P==='و'&&n.pos==='fm'?'':' (واو مدّ)')+'؛ فتُكتب مفردة على السطر (ء).';break;
    case 'm-lin':s='همزة متوسطة مفتوحة بعد واو ساكنة مفتوح ما قبلها (واو لين)؛ فالقياس أن تُعامل كالمفتوحة بعد ساكن فتُكتب على الألف (أ)، ويكتبها بعضهم على السطر (ء).';break;
    case 'm-waw-u':s='همزة متوسطة مضمومة بعد واو ساكنة؛ فتُكتب على السطر (ء) فراراً من توالي واوين.';break;
    case 'm-strong':s='همزة متوسطة '+HN[n.hh]+' وما قبلها '+(n.ph==='o'?'ساكن':HN[n.ph]+'؛ أي عليه '+HV[n.ph])+'. نقارن '+HV[n.hh]+' و'+HV[n.ph]+'، وأقواهما '+HV[n.win]+'، فتُكتب على '+(SEATN[SEAT[n.win==='o'?'a':n.win]])+'. (ترتيب القوة: الكسرة ← الضمة ← الفتحة ← السكون)';break;
  }
  if(n.tnRule==='tn-con'||n.tnRule==='suf-con'){s=s.replace('فتُكتب مفردة على السطر (ء).','فحقّها أن تُكتب مفردة على السطر (ء)،');}
  if(n.pos==='fm'){s='الهمزة متطرفة في أصلها، لكن اتصلت بها لاحقة فصارت متوسطة وتُطبَّق عليها قواعد المتوسطة: '+s;}
  if(n.rule2==='twin-alif'){s+=' وبعدها ألف مدّ، فتجتمع الألفان وتُكتبان مدّة: آ.';}
  if(n.rule3==='keep'){s+=' ويُبقيها بعضهم على السطر كما كانت متطرفة (جزءَه).';}
  if(n.rule2==='twin-waw'){s+=' وبعدها واو مدّ؛ فالقياس كتابتها على الواو (ؤ)، ويكتبها بعضهم '+(n.altSeat==='ئ'?'على نبرة (ئ)':'على السطر (ء)')+' فراراً من توالي واوين'+(n.alt2?'، ويُبقيها آخرون على الألف كما في الفعل (يقرأون)':'')+'.';}
  switch(n.tnRule){
    case 'tn-alif':s+=' وتنوين النصب لا تُزاد له ألف لأن الهمزة على الألف أصلاً: «ـأً».';break;
    case 'tn-after-alif':s+=' وتنوين النصب هنا بلا ألف، كراهة توالي ألفين بينهما همزة: «ـاءً».';break;
    case 'tn-con':s+=' ومع تنوين النصب تُزاد ألف، ولأن ما قبل الهمزة حرف يتصل بما بعده تُكتب الهمزة على نبرة: «ـئًا».';break;
    case 'tn-nocon':s+=' ومع تنوين النصب تُزاد ألف، ولأن ما قبل الهمزة حرف لا يتصل بما بعده تبقى الهمزة على السطر: «ـءًا».';break;
    case 'tn-wy':s+=' ومع تنوين النصب تُزاد ألف بعدها: «'+n.seat+'ًا».';break;
    case 'suf-merge':s+=' واتصلت بها ألف (ألف التثنية أو الاثنين أو جمع المؤنث) فتجتمع الألفان مدّة: «آ».';break;
    case 'suf-verb-dual':s+=' واتصلت بها ألف الاثنين؛ فتُكتب «أا» على الأشهر، ويجيز بعضهم المدّة «آ».';break;
    case 'suf-after-alif':s+=' واتصلت بها ألف؛ فتبقى على السطر بعد الألف: «اءا».';break;
    case 'suf-con':s+=' واتصلت بها ألف، وما قبلها يتصل بما بعده، فتُكتب على نبرة: «ئا».';break;
    case 'suf-nocon':s+=' واتصلت بها ألف، وما قبلها لا يتصل بما بعده، فتبقى على السطر: «ءا».'+(n.altSeat==='آ'?' ويكتبها بعضهم مدّة «جزآن» قياساً على المتوسطة.':'');break;
    case 'suf-wy':s+=' واتصلت بها ألف فتبقى على صورتها: «'+n.seat+'ا».';break;
  }
  return s;
}

/* الواجهة: يكتب الكلمة ويعطي البدائل والتعليل */
function write(input,o){
  var A=analyze(input,o),R0=render(A),out=R0.s,plain=strip(out);
  var alts=[];
  A.notes.forEach(function(n){
    if(n.altSeat){var ch={};ch[n.k]='alt';var ao=render(A,ch).s;
      var sc=n.rule2==='twin-waw'?'egy':(n.tnRule==='suf-verb-dual'?'dual':(n.altSchool&&SCHOOL[n.altSchool]?n.altSchool:'qiyas'));
      alts.push({out:ao,plain:strip(ao),school:sc,k:n.k});}
    if(n.alt2){var c2={};c2[n.k]=n.alt2;var a2=render(A,c2).s;alts.push({out:a2,plain:strip(a2),school:'keep2',k:n.k});}
  });

}

var HARF_YA=['على','إلى','حتّى','بلى'],MABNI_YA=['لدى','متى','أنّى','الألى'],FOREIGN_YA=['موسى','عيسى','كسرى','بخارى','متّى'];
function layyina(o){ /* o:{w (الكلمة مجرّدة بلا الحرف الأخير), k:kind, n:عدد الحروف, org:'و'|'ي', pya:ياء قبلها} */
  if(o.k==='harf'){return HARF_YA.indexOf(o.w+'ى')>=0?{c:'ى',r:'harf-ya'}:{c:'ا',r:'harf'};}
  if(o.k==='mabni'){return MABNI_YA.indexOf(o.w+'ى')>=0?{c:'ى',r:'mabni-ya'}:{c:'ا',r:'mabni'};}
  if(o.k==='foreign'){return FOREIGN_YA.indexOf(o.w+'ى')>=0?{c:'ى',r:'foreign-ya'}:{c:'ا',r:'foreign'};}

}

/* محاذاة حرفية لاستخراج مواضع الاختلاف */
function diff(a,b){
  var n=a.length,m=b.length,L=[],i,j;for(i=0;i<=n;i++){L[i]=[];for(j=0;j<=m;j++){L[i][j]=0;}}
  for(i=n-1;i>=0;i--){for(j=m-1;j>=0;j--){L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);}}
  var ops=[];i=0;j=0;
  while(i<n||j<m){
    if(i<n&&j<m&&a[i]===b[j]){i++;j++;continue;}
    if(i<n&&j<m&&L[i+1][j+1]===L[i][j]){ops.push({t:'sub',ai:i,bj:j,a:a[i],b:b[j]});i++;j++;continue;}
    if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){ops.push({t:'ins',ai:i,bj:j,b:b[j]});j++;}
    else{ops.push({t:'del',ai:i,bj:j,a:a[i]});i++;}
  }
  return ops;
}
/* item: {ans (الرسم الصحيح)، alts:[{plain,school,note}]، notes (من المحرّك)، why} ؛ pref: المدرسة المعتمدة أو 'all' */
function check(student,item,pref){
  var s=norm(student),ok=norm(item.ans),res={ok:false,given:s};
  if(!s){res.msg='لم تكتب شيئاً.';return res;}
  if(s===ok){res.ok=true;var acc=(item.alts||[]).filter(function(a){return a.acc!==false;});if(acc.length){res.note='ويجوز أيضاً: '+acc.map(function(a){return '«'+(a.full||a.plain)+'» ('+(SCHOOL[a.school]?SCHOOL[a.school].n:a.school)+')';}).join('، ')+'.';}return res;}
  var al=(item.alts||[]).filter(function(a){return norm(a.plain)===s;})[0];
  if(al&&al.acc===false){res.ok=false;res.soft=true;res.msg='«'+s+'» '+(SCHOOL[al.school]?'هو '+SCHOOL[al.school].n+': '+SCHOOL[al.school].d:'رسم خاص')+' والصواب في الكتابة المعتادة: «'+ok+'».';return res;}
  if(al){
    var sc=SCHOOL[al.school]||{n:al.school,d:''};
    if(pref&&pref!=='all'&&al.school!==pref&&!(pref==='std'&&al.school==='dual')){res.ok=false;res.soft=true;res.msg='«'+s+'» رسم صحيح في '+sc.n+'، لكنك اخترت في الإعدادات اعتماد '+(SCHOOL[pref]?SCHOOL[pref].n:pref)+'، وعليه تُكتب: «'+ok+'».';return res;}
    res.ok=true;res.note='رسمك صحيح على '+sc.n+': '+sc.d+' والرسم القياسي: «'+ok+'».';return res;
  }
  /* تشخيص الخطأ */
  var ops=diff(s,ok),R=[];
  ops.forEach(function(op){
    var x=op.a||'',y=op.b||'';
    if(op.t==='sub'&&HSET.indexOf(x)>=0&&HSET.indexOf(y)>=0){R.push({k:'seat',at:op.bj,got:x,want:y});}
    else if(op.t==='sub'&&'ةهت'.indexOf(x)>=0&&'ةهت'.indexOf(y)>=0){R.push({k:'taa',got:x,want:y});}
    else if(op.t==='ins'&&y==='ا'&&op.bj===ok.length-1){R.push({k:'tnadd'});}
    else if(op.t==='del'&&x==='ا'&&op.ai===s.length-1){R.push({k:'tnextra'});}
    else if(op.t==='ins'&&y==='ا'){R.push({k:'alifmiss',at:op.bj});}
    else if(op.t==='del'&&x==='ا'){R.push({k:'alifextra'});}
    else if(op.t==='del'&&HSET.indexOf(x)>=0){R.push({k:'hextra',got:x});}
    else if(op.t==='ins'&&HSET.indexOf(y)>=0){R.push({k:'hmiss',want:y});}
    else{R.push({k:'other'});}
  });
  var st=[],ws=[],nn=item.notes||[];
  function nAt(at){return nn.filter(function(q){return q.at===at;})[0]||null;}
  function addW(w){if(w&&ws.indexOf(w)<0){ws.push(w);}}
  var tnN=nn.filter(function(q){return q.tnRule;})[0];
  R.forEach(function(r){
    if(r.k==='seat'){
      var n=nAt(r.at);
      if(r.want==='آ'){st.push('هنا همزة بعدها ألف مدّ فتُكتبان مدّة «آ»');addW(n?n.why:item.why);}
      else if(r.want==='ا'&&'أإآ'.indexOf(r.got)>=0){st.push('هذه همزة وصل تُكتب ألفاً بلا رأس همزة «ا» لا «'+r.got+'»');addW(item.why);}
      else if('أإ'.indexOf(r.want)>=0&&r.got==='ا'){st.push('هذه همزة قطع فتُرسم «'+r.want+'» لا ألفاً مجرّدة');addW(n?n.why:item.why);}
      else if(r.want==='ى'||r.got==='ى'){st.push('الألف في آخر الكلمة تُكتب هنا «'+r.want+'» لا «'+r.got+'»');addW(item.why);}
      else{st.push('كتبتَ الهمزة على '+(SEATN[r.got]||r.got)+'، والصواب على '+(SEATN[r.want]||r.want));addW(n?n.why:item.why);}
    }
    else if(r.k==='taa'){st.push('كتبتَ «'+r.got+'» والصواب «'+r.want+'»');addW(item.why);}
    else if(r.k==='tnadd'){st.push('نسيتَ ألف تنوين النصب');addW(tnN?tnN.why:item.why);}
    else if(r.k==='tnextra'){st.push('زدتَ ألفاً في آخر الكلمة لا موضع لها');addW(tnN?tnN.why:item.why);}
    else if(r.k==='hmiss'){st.push('سقطت الهمزة «'+r.want+'» من كتابتك');addW(item.why);}
    else if(r.k==='hextra'){st.push('زدتَ «'+r.got+'» في غير موضعها');addW(item.why);}
    else if(r.k==='alifmiss'){st.push('سقطت ألف من كتابتك');addW(item.why);}
    else if(r.k==='alifextra'){st.push('زدتَ ألفاً لا موضع لها');addW(item.why);}
  });
  st=uniqS(st);if(st.length>1){st=[st.slice(0,-1).join('، ')+'، و'+st[st.length-1]];}
  res.msg=(st.length?st.join('، ')+'. ':'الصواب: «'+ok+'». ')+ws.join(' ');
  res.kinds=R.map(function(r){return r.k;});
  return res;
}

/* عنصر سؤال جاهز من صيغة نطقية: يحسب الرسم والبدائل ومواضع الهمزات */
function item(input,extra){

/* صور خاطئة شائعة (مشكولة) لكلمة: تغيير صورة كل همزة، وزيادة ألف التنوين أو حذفها */
function variants(input){
  var A=analyze(input),W=write(input),okP=[W.plain].concat(W.alts.map(function(a){return a.plain;})),out=[],seen={};
  okP.forEach(function(p){seen[p]=1;});
  function add(ch){var r=render(A,ch).s,p=strip(r);if(!seen[p]){seen[p]=1;out.push(r);}}
  A.notes.forEach(function(n){
    var C=n.pos==='i'?['أ','إ','ا','آ']:['أ','ؤ','ئ','ء'];
    C.forEach(function(c){if(c!==n.seat){var ch={};ch[n.k]=c;add(ch);}});
    if(n.ext==='tn'||(n.pos==='f'&&TN&&false)){var ch2={};ch2['tn'+n.k]=!n.addAlif;add(ch2);var ch3={};ch3['tn'+n.k]=!n.addAlif;ch3[n.k]=n.seat==='ئ'?'ء':(n.seat==='ء'?'ئ':n.seat);add(ch3);}
  });
  return out;
}
/* الصيغة النطقية كما يسمعها الطالب: كل همزة «ء»، وهمزة الوصل «ء» بحركتها، وبلا فواصل */
function spoken(input){

  return t.replace(/[أإؤئ]/g,'ء').replace(/آ/g,'ءَا');
}

  try{AEL.pause();}catch(e){}
  function go(x,buf){
    var url=URL.createObjectURL(new Blob([buf.slice(x[1],x[1]+x[2])],{type:'audio/mpeg'}));
    if(AEL._u){URL.revokeObjectURL(AEL._u);}AEL._u=url;AEL.src=url;
    AEL.onplaying=function(){end(true);};AEL.onerror=function(){end(false,'decode');};
    var pr=AEL.play();if(pr&&pr.catch){pr.catch(function(e){end(false,e&&e.name==='NotAllowedError'?'blocked':'play');});}
  }
  /* إن كان الفهرس والحزمة محمّلين شُغّل المقطع في اللمسة نفسها (شرط آيفون)، وإلا بعد وصولهما */
  var x=AUDIX&&AUDIX[t];
  if(x&&PBUF[x[0]]){go(x,PBUF[x[0]]);}
  else{IDXP.then(function(){var y=AUDIX[t];if(!y){end(false,'noclip');return;}getPack(y[0]).then(function(b){go(y,b);},function(){end(false,'fetch');});});}
  setTimeout(function(){end(false,'timeout');},8000);
}
function speak(text,rate,cb){
  if(hasClip(text)){
    playClip(text,function(ok,why){
      if(ok||why==='blocked'){if(cb){cb(ok,why);}return;}
      ttsSpeak(text,rate,cb);
    });
    return true;
  }
  return ttsSpeak(text,rate,cb);
}
function ttsSpeak(text,rate,cb){
  var done=false;function end(ok,why){if(done){return;}done=true;if(cb){cb(ok,why);}}
  if(!canSpeak()){end(false,'none');return false;}
  try{
    var v=arVoice(),m=new SpeechSynthesisUtterance(text);
    m.lang=v?v.lang:'ar-SA';if(v){m.voice=v;}m.rate=rate||0.8;
    m.onstart=function(){end(true);};
    m.onerror=function(e){if(e&&(e.error==='interrupted'||e.error==='canceled')){return;}end(false,e&&e.error);};
    m.onend=function(){end(true);};
    speechSynthesis.cancel();
    setTimeout(function(){try{speechSynthesis.resume();speechSynthesis.speak(m);}catch(e){end(false,'err');}},60);
    setTimeout(function(){end(false,v?'timeout':'novoice');},3500);
    return true;
  }catch(e){end(false,'err');return false;}
}
