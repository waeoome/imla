/* ================= مولّدات الأسئلة من بنك الكلمات ================= */
var GEN={};
function take(L,n){var a=shuffle(L.slice()),out=[];while(out.length<n&&a.length){out.push(a.shift());}while(out.length<n&&L.length){out.push(rnd(L));}return out;}
function alt(arr,it,key,k){var v=typeof key==='function'?key:function(x){return x[key];};return uniq(shuffle(arr.filter(function(x){return v(x)!==v(it);}).map(v))).slice(0,k||3);}
function choiceQ(p,right,wrongs,why,x){var o=[right].concat(uniq(wrongs).filter(function(w){return w!==right;})),s=shuffle(o.slice());var q={t:'choice',p:p,o:s,a:s.indexOf(right),why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
GEN.data=function(o){var out=[],D=typeof o.d==='function'?o.d():o.d;take(D,Math.min(o.n||6,D.length)).forEach(function(it){var q=o.f(it,D);if(q){if(o.sk&&!q.sk){q.sk=o.sk;}if(o.dd&&!q.d){q.d=o.dd;}out.push(q);}});return out;};
function expand(pool){var out=[];pool.forEach(function(q){if(q.gen){var f=GEN[q.gen];if(f){f(q).forEach(function(x){if(q.tp){x.tp=q.tp;}out.push(x);});}}else{out.push(q);}});return out;}

/* ---------- عناصر البنك ----------
   H(ph,x): عنصر همزة من صيغة نطقية (يحسب المحرّك رسمه وبدائله وصوره الخاطئة وتعليله).
   W(ans,wr,why,x): عنصر يدوي (الوصل والقطع، الألف اللينة، التاء والهاء...) برسمه الصحيح وصوره الخاطئة وسببه. */
var ICACHE={};
function H(ph,x){
  var key=ph+'|'+JSON.stringify(x||{});if(ICACHE[key]){return ICACHE[key];}
  var it=IMLA.item(ph,x);it.wr=IMLA.variants(ph);it.kind='h';
  if(it.xalt){it.xalt.forEach(function(a){var p=IMLA.strip(a[0]);it.alts.push({plain:p,full:a[0],school:a[1],note:a[2]||'',acc:a[3]!==false});it.wr=it.wr.filter(function(w){return IMLA.strip(w)!==p;});});}
  if(x&&x.xwr){var okp=[it.ans].concat(it.alts.map(function(a){return a.plain;}));it.wr=uniq(x.xwr.concat(it.wr)).filter(function(w){return okp.indexOf(IMLA.strip(w))<0;});}
  if(x&&x.e&&IMLA.strip(it.full)!==x.e){it.bad='المحرّك: '+IMLA.strip(it.full)+' ≠ '+x.e;}
  it.disp=HW(ph);it.lab=it.lab||'';
  dedupWr(it);ICACHE[key]=it;return it;
}
function W(ans,wr,why,x){
  var it={ans:IMLA.strip(ans),full:ans,wr:wr,why:why,notes:[],alts:[],kind:'w'};
  if(x){for(var k in x){it[k]=x[k];}}
  if(it.alt){it.alts=it.alt.map(function(a){return {plain:IMLA.strip(a[0]),full:a[0],school:a[1],note:a[2]||'',acc:a[3]!==false};});}
  it.disp=it.disp||esc(ans);return dedupWr(it);
}
function dedupWr(it){var seen={},out=[],okp=[it.ans].concat((it.alts||[]).map(function(a){return a.plain;}));okp.forEach(function(x){seen[IMLA.norm(x)]=1;});(it.wr||[]).forEach(function(w){var k=IMLA.norm(w);if(!seen[k]){seen[k]=1;out.push(w);}});it.wr=out;return it;}
function okForms(it){return [it.full].concat((it.alts||[]).map(function(a){return a.full||a.plain;}));}
function shown(it){return it.disp||esc(it.full);}
/* صورة مختصرة لسبب رسم الهمزة (لأسئلة «لماذا؟») */
function shortWhy(n){
  var HV=IMLA.HV;
  switch(n.rule){
    case 'i-fath':case 'i-kasr':return 'لأنها في أول الكلمة، والهمزة الأولى تُكتب على الألف دائماً';
    case 'i-madd':case 'i-twin-a':return 'لأنها همزة بعدها ألف مدّ فتُكتبان مدّة';
    case 'm-i':return 'لأنها مكسورة، والكسرة أقوى الحركات';
    case 'm-ya':return 'لأن قبلها ياء ساكنة';
    case 'm-alif-a':return 'لأنها مفتوحة بعد ألف، فتُكتب على السطر';
    case 'm-alif-u':return 'لأنها مضمومة بعد ألف، فتُكتب على الواو';
    case 'm-waw-a':case 'm-waw-u':return 'لأنها بعد واو ساكنة، فتُكتب على السطر';
    case 'm-strong':return n.rule2==='twin-alif'?'لأنها همزة بعدها ألف مدّ فتُكتبان مدّة':(n.win===n.hh&&n.win!==n.ph?'لأن حركتها ('+HV[n.hh]+') أقوى من حركة ما قبلها':(n.win===n.ph&&n.win!==n.hh?'لأن حركة ما قبلها ('+HV[n.ph]+') أقوى من حركتها':'لأن حركتها وحركة ما قبلها واحدة ('+HV[n.hh]+')'));
    case 'f-a':return 'لأنها متطرفة وما قبلها مفتوح';
    case 'f-u':return 'لأنها متطرفة وما قبلها مضموم';
    case 'f-i':return 'لأنها متطرفة وما قبلها مكسور';
    case 'f-alif':case 'f-madd':case 'f-sukun':return n.tnRule==='tn-con'||n.tnRule==='suf-con'?'لأن ما قبلها ساكن يتصل بما بعده، ولحقتها ألف':'لأنها متطرفة وما قبلها ساكن';
  }
  return '';
}
var WHYPOOL=['لأنها في أول الكلمة، والهمزة الأولى تُكتب على الألف دائماً','لأنها مكسورة، والكسرة أقوى الحركات','لأن قبلها ياء ساكنة','لأنها مفتوحة بعد ألف، فتُكتب على السطر','لأنها مضمومة بعد ألف، فتُكتب على الواو','لأن حركتها أقوى من حركة ما قبلها','لأن حركة ما قبلها أقوى من حركتها','لأنها متطرفة وما قبلها مفتوح','لأنها متطرفة وما قبلها مضموم','لأنها متطرفة وما قبلها مكسور','لأنها متطرفة وما قبلها ساكن','لأنها همزة بعدها ألف مدّ فتُكتبان مدّة'];
/* «عائلة» السبب: خياران من العائلة نفسها يقولان المعنى ذاته بعبارتين، فلا يجوز أن يكون أحدهما مشتّتاً للآخر */
function whyFam(x){
  if(x.indexOf('ألف مدّ')>=0){return 'madd';}
  if(x.indexOf('أول الكلمة')>=0){return 'init';}
  if(x.indexOf('مكسورة، والكسرة')>=0||(x.indexOf('لأن حركتها')===0&&x.indexOf('أقوى من حركة ما قبلها')>=0)){return 'hh';}
  if(x.indexOf('حركة ما قبلها')>=0&&x.indexOf('أقوى من حركتها')>=0){return 'ph';}
  if(x.indexOf('بعد واو ساكنة')>=0){return 'waw';}
  return x;
}
function mainNote(it){var n=it.notes||[];if(it.focus!=null){return n[it.focus]||n[0];}for(var i=n.length-1;i>=0;i--){if(n[i].pos!=='i'||n.length===1){return n[i];}}return n[0];}
var SEATLAB={'أ':'على الألف (أ)','إ':'تحت الألف (إ)','آ':'مدّة (آ)','ؤ':'على الواو (ؤ)','ئ':'على النبرة (ئ)','ء':'على السطر (ء)'};

/* ---------- أنواع الأسئلة ---------- */
/* النص المسموع لعنصر: بشرط وجود مقطع له أو صوت في الجهاز */
function sayOf(it){var t=it&&(it.say||it.full||it.ans);return t&&(hasClip(t)||canSpeak())?t:null;}
function sOf(it){return it.ss&&it.ss.length?rnd(it.ss):(it.s||null);}
function ctxOf(it){return sOf(it);}
/* ١. اختر الرسم الصحيح */
function gPick(it){
  var right=it.full,w=pick(it.wr,3);if(!w.length){return null;}
  var cs=ctxOf(it),sp=sayOf(it);var q=choiceQ(cs?'اختر الرسم الصحيح للكلمة الناقصة'+(sp?' (استمع إليها)':'')+':':(sp?'استمع إلى الكلمة، ثم اختر كتابتها الصحيحة':'اختر الكلمة المكتوبة كتابة صحيحة'+(it.clue?' ('+it.clue+')':'')),right,w,'<b>'+shown(it)+'</b>: '+tx(it.why),{s:cs,sk:it.sk,d:1,tag:it.tag});
  if(sp){q.say=sp;q.sayFb=it.ph?IMLA.spoken(it.ph):'';}
  return q;
}
/* ٢. على أي صورة؟ */
function gSeat(it){
  if(it.kind!=='h'){return null;}
  var n=mainNote(it);if(!n){return null;}
  var right=SEATLAB[n.seat],opts=uniq(['على الألف (أ)','على الواو (ؤ)','على النبرة (ئ)','على السطر (ء)'].concat(n.pos==='i'?['تحت الألف (إ)']:[]).concat(n.seat==='آ'?['مدّة (آ)']:[]));
  var sp=sayOf(it);
  var q=choiceQ('استمع إلى الكلمة: كيف تُكتب همزتها'+(it.notes.length>1?' '+(n.pos==='i'?'الأولى':(n.pos==='f'?'الأخيرة':'الوسطى')):'')+'؟',right,pick(opts.filter(function(o){return o!==right;}),3),'<b>'+shown(it)+'</b>: '+tx(n.why),{s:ctxOf(it),sk:it.sk,d:1,tag:it.tag});
  if(sp){q.say=sp;q.sayFb=IMLA.spoken(it.ph);}else{q.p='كيف تُكتب الهمزة في: «'+IMLA.spoken(it.ph)+'»؟';}
  return q;
}
/* ٣. لماذا؟ */
function gWhy(it){
  if(it.kind!=='h'){return it.whyOpts?choiceQ('لماذا كُتبت «'+it.full+'» هكذا؟',it.whyOpts[0],it.whyOpts.slice(1),tx(it.why),{sk:it.sk,d:2,tag:it.tag}):null;}
  var n=mainNote(it),right=shortWhy(n);if(!right){return null;}
  var fr=whyFam(right),w=WHYPOOL.filter(function(x){var f=whyFam(x);return x!==right&&f!==fr&&!(fr==='init'&&f==='hh');});
  return choiceQ('لماذا كُتبت الهمزة '+SEATLAB[n.seat]+' في «'+it.full+'»؟',right,pick(w,3),tx(n.why),{sk:it.sk,d:2,tag:it.tag});
}
/* ٤. صواب أم خطأ */
function gTF(it){
  var isOk=Math.random()<0.45,f=isOk?it.full:rnd(it.wr);if(!f){return null;}
  var ts=sOf(it);return TF('«'+f+'» مكتوبة كتابة صحيحة'+(ts?' في: '+ts.replace('___','…'):'')+'.',isOk,(isOk?'':'الصواب: <b>'+shown(it)+'</b>. ')+tx(it.why),{sk:it.sk,d:1,tag:it.tag});
}
/* ٥. اكتب (بالنطق أو بالتلميح أو بالسماع) */
function gWrite(it,mode){
  mode=mode||(it.ph?'phon':'clue');
  if(mode==='phon'&&!it.ph){mode=it.clue?'clue':'dict';}
  if(mode==='clue'&&!it.clue){mode=it.ph?'phon':'dict';}
  var q=WRITE(it,{mode:mode,s:sOf(it),clue:it.clue||null,sk:it.sk,d:mode==='dict'?3:2,tag:it.tag});
  if(it.say){q.sayText=it.say;}
  return q;
}
/* ٦. صنّف إلى سلال بحسب صورة الهمزة */
function gSortSeats(items){
  items=items.filter(function(it){return it.kind==='h'&&mainNote(it);});
  var by={};items.forEach(function(it){var s=mainNote(it).seat;if(s==='إ'){s='أ';}(by[s]=by[s]||[]).push(it);});
  var keys=Object.keys(by);if(keys.length<2){return null;}
  keys=pick(keys,Math.min(4,keys.length));
  var w=[];keys.forEach(function(k){pick(by[k],2).forEach(function(it){var sy=sayOf(it);w.push(sy?{t:'🔊',say:sy,full:it.full,b:k,n:it.full}:{t:IMLA.spoken(it.ph),b:k,n:it.full});});});
  return SORT((w.some(function(x){return x.say;})?'المس كل بطاقة لتسمع كلمتها، ثم ضعها في سلّة صورة همزتها ':'ضع كل كلمة (مكتوبة كما تُنطق) في سلّة صورة همزتها ')+(items.some(function(it){return it.notes.length>1;})?'الوسطى أو الأخيرة':'')+':',keys.map(function(k){return {id:k,n:SEATLAB[k]};}),w,'',{sk:items[0].sk,d:2});
}
/* ٧. صائد الأخطاء في جملة أو فقرة */
function gHunt(items,nBad){
  items=items.filter(function(it){return it.s&&it.wr&&it.wr.length;});if(items.length<2){return null;}
  var sel=pick(items,Math.min(3,items.length)),bad=pick(sel.map(function(_,i){return i;}),nBad||Math.max(1,Math.min(2,sel.length-1)));
  var words=[];
  sel.forEach(function(it,i){
    var isBad=bad.indexOf(i)>=0,wf=isBad?rnd(it.wr):it.full,parts=sOf(it).split('___');
    parts[0].split(/\s+/).filter(Boolean).forEach(function(w){words.push({t:w,bad:false});});
    words.push({t:wf,bad:isBad,fix:it.full,why:it.why});
    (parts[1]||'').split(/\s+/).filter(Boolean).forEach(function(w){words.push({t:w,bad:false});});
  });
  return HUNT('في هذه الجمل كلمات كُتبت خطأً. المسها، ثم اضغط «تحقّق».',words,{sk:'d',d:3});
}
/* ٨. أكمل الجملة بحسب الإعراب (أبناءَكم/أبناؤُكم/أبنائِكم) */
function gCase(set){ /* set: [{it, s}] للكلمة نفسها في حالات مختلفة */
  var k=rnd(set),seen={},opts=[];seen[IMLA.norm(k.it.full)]=1;
  set.forEach(function(x){var n=IMLA.norm(x.it.full);if(!seen[n]){seen[n]=1;opts.push(x.it.full);}});
  if(!opts.length){var q0=gPick(k.it);if(q0){q0.s=k.s;q0.why2='في الأحوال الإعرابية الثلاث تبقى صورة الهمزة واحدة هنا.';}return q0;}
  return choiceQ('أكمل الجملة بالرسم الصحيح:',k.it.full,opts,'<b>'+shown(k.it)+'</b>'+(k.c?' ('+k.c+')':'')+': '+tx(mainNote(k.it).why),{s:k.s,sk:'c',d:2,tag:'case'});
}
/* مزيج من الأسئلة لعنصر واحد بحسب الصعوبة المطلوبة */
function anyQ(it,lvl){
  var fs=lvl===1?[gPick,gSeat,gTF]:(lvl===2?[gPick,gSeat,gWhy,gWrite]:[gWrite,gWhy,gPick,function(x){return gWrite(x,'dict');}]);
  var f=rnd(fs),q=f(it);if(!q){q=gPick(it)||gWrite(it);}return q;
}
/* مواصفة أسئلة درس كاملة من مجموعة عناصر */
function topicGen(items,o){
  o=o||{};
  return [
    {gen:'data',d:items,n:o.n1||8,f:gPick},
    {gen:'data',d:function(){return items.filter(function(it){return it.kind==='h';});},n:o.n2||6,f:gSeat},
    {gen:'data',d:items,n:o.n3||5,f:gWhy},
    {gen:'data',d:items,n:o.n4||4,f:gTF},
    {gen:'data',d:items,n:o.n5||7,f:function(it){return gWrite(it);}},
    {gen:'data',d:function(){return items.filter(function(it){return it.s;});},n:o.n6||2,f:function(it,arr){return gHunt(arr);}},
    {gen:'data',d:[1],n:items.some(function(it){return it.kind==='h';})?1:0,f:function(){return gSortSeats(items);}}
  ];
}

/* بناء درس: العناصر + الخطوات + الأسئلة المولَّدة + أسئلة يدوية */
var ALLITEMS=[];
function TOPIC(o){
  (o.items||[]).forEach(function(it){if(!it.sk){it.sk=o.sk;}ALLITEMS.push(it);});
  var qs=(o.items&&o.items.length?topicGen(o.items,o.gen||{}):[]).concat(o.qs||[]);
  return {title:o.title,sub:o.sub,sk:o.sk,steps:o.steps,items:o.items||[],qs:qs};
}
/* سلسلة جمل لكلمة واحدة في أحوال إعرابية مختلفة */
function CASESET(arr){return arr.map(function(x){return {it:H(x[0],{s:x[1]}),s:x[1],c:x[2]};});}

/* ================= question types ================= */
var Types={};
/* question helpers for content */
function C(p,o,a,why,x){var q={t:'choice',p:p,o:o,a:a,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
function TF(p,truth,why,x){var q={t:'choice',p:p,o:['صواب','خطأ'],a:truth?0:1,fix:true,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
function MATCH(p,pairs,why,x){var q={t:'match',p:p,pairs:pairs,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
function SORT(p,b,w,why,x){var q={t:'sort',p:p,b:b,w:w,why:why};if(x){for(var k in x){q[k]=x[k];}}return q;}
function ORDER(p,w,why){return {t:'order',p:p,w:w,why:why};}
function TAP(p,s,a,why){return {t:'tap',p:p,s:s,a:a,why:why};}
function Q(p,r,w,why,x){return C(p,[r].concat(w.split('|')),0,why,x);}
function OPEN(p,model,x){var q={t:'open',p:p,model:model};if(x){for(var k in x){q[k]=x[k];}}return q;}

/* ---- صندوق الاستماع: زر يُسمع الكلمة أو الجملة، ورسالة عند تعذّر الصوت، والنطق مكتوباً احتياطاً فقط ---- */
function sayLabT(t){return '🔊 استمع إلى '+(/\s/.test(String(t||'').trim())?'الجملة':'الكلمة');}
function sayBox(text,fb){return '<div class="saywrap" data-say="'+esc(text)+'"><button class="btn ghost say">'+sayLabT(text)+'</button><div class="saymsg" hidden></div>'+(fb?'<div class="phbox sayfb" hidden><small>تُنطق هكذا:</small><span class="spk big">'+esc(fb)+'</span></div>':'')+'</div>';}
function bindSay(root,auto){
  var w=root.classList&&root.classList.contains('saywrap')?root:$('.saywrap',root);if(!w){return;}
  var text=w.getAttribute('data-say'),say=$('.say',w);preClip(text);
  function run(isAuto){say.disabled=true;say.textContent='🔊 جارٍ النطق…';
    speak(text,0.7,function(ok,why){
      say.disabled=false;say.textContent=ok?'🔊 أعد الاستماع':sayLabT(text);
      var m=$('.saymsg',w),fb=$('.sayfb',w);
      if(ok){m.hidden=true;return;}
      if(isAuto){return;}
      m.innerHTML='لم يصدر صوت: '+(why==='novoice'||why==='language-unavailable'||why==='voice-unavailable'||why==='fetch'?'تعذّر تشغيل المقطع ولا يتوفر صوت عربي في جهازك. لتفعيل الصوت العربي في أندرويد: الإعدادات ← الإدارة العامة ← تحويل النص إلى كلام ← ثبّت «العربية»؛ وفي آيفون: الإعدادات ← تسهيلات الاستخدام ← المحتوى المنطوق ← الأصوات ← العربية.':'تأكد من رفع صوت الوسائط وإلغاء الوضع الصامت، ثم أعد المحاولة.')+(fb?' وإلى ذلك الحين استعن بالنطق المكتوب أدناه.':'');
      m.hidden=false;if(fb){fb.hidden=false;}
    });}
  say.onclick=function(){run(false);};
  if(auto){setTimeout(function(){if(document.body.contains(say)){run(true);}},300);}
}
function autoHints(q){return q.hh||null;}
function mountQ(host,q,o){
  o=o||{};
  var st={done:false,hints:0,idk:false};
  var hh=o.noHint?null:autoHints(q);
  host.innerHTML='<div class="qb"></div>'+(hh?'<div class="hintwrap"><div class="hintbox" hidden></div><button class="btn ghost sm hb">تلميح</button></div>':'')+(o.idk?'<button class="btn ghost wide idk">لا أعرف</button>':'')+'<div class="fbh" aria-live="polite"></div>';
  var qb=$('.qb',host),fh=$('.fbh',host);
  qb.innerHTML=Types[q.t].html(q,st);
  var hb=$('.hb',host);
  if(hb){
    hb.textContent='تلميح (١/٣)';
    hb.onclick=function(){
      if(st.done){return;}
      var box=$('.hintbox',host);box.hidden=false;
      box.innerHTML=hh.slice(0,st.hints+1).map(function(h,i){return '<div><b>'+num(i+1)+'.</b> '+tx(h)+'</div>';}).join('');
      st.hints++;S.hints=(S.hints||0)+1;save();
      hb.textContent=st.hints>=hh.length?'لا مزيد من التلميحات':'تلميح ('+num(st.hints+1)+'/'+num(hh.length)+')';
      if(st.hints>=hh.length){hb.disabled=true;}
    };
  }
  function fin(ok,msg,why){
    if(st.done){return;}
    st.done=true;
    if(hb){hb.hidden=true;}
    var ib=$('.idk',host);if(ib){ib.hidden=true;}
    if(!o.silent){
      fh.innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?(st.hints?'أحسنت! أصبتَ بمساعدة التلميح':'أحسنت! إجابة صحيحة'):'ليست هذه الإجابة')+'</b>'+(msg?'<div>'+tx(msg)+'</div>':'')+(why?'<div>'+tx(why)+'</div>':'')+'</div>'+
        (o.nextLabel?'<button class="btn primary" id="nextq">'+o.nextLabel+'</button>':'')+
        (o.retry&&!ok?'<button class="btn ghost" id="retryq">أعد المحاولة</button>':'')+
        (o.report!==false&&!o.noReport?'<button class="reportlink" id="rep">أبلغ عن خطأ في هذا السؤال</button>':'');
      var nb=$('#nextq',fh);
      if(nb){nb.onclick=function(){if(o.onNext){o.onNext(ok);}};try{nb.scrollIntoView({block:'nearest'});}catch(e){}}
      var rb=$('#retryq',fh);
      if(rb){rb.onclick=function(){mountQ(host,q,o);};}
      var rp=$('#rep',fh);
      if(rp){rp.onclick=function(){if(window.__report){window.__report(q);}};}
    }
    if(o.onEnd){o.onEnd(ok,st);}
  }
  var ib2=$('.idk',host);
  if(ib2){ib2.onclick=function(){if(st.done){return;}st.idk=true;fin(false,'','');};}
  Types[q.t].bind(q,st,qb,fin);
  return st;
}
function lockOpts(qb,sel,rightKey,attr){
  $$(sel,qb).forEach(function(o){
    o.disabled=true;
    if(o.getAttribute(attr)===String(rightKey)){o.classList.add('right');}
  });
}
function chipsH(list){return '<div class="sent">'+list.map(function(w){return '<span class="w">'+w+'</span>';}).join('')+'</div>';}

/* ---- choice ---- */
Types.choice={
  html:function(q,st){
    st.ord=q.fix?q.o.map(function(_,i){return i;}):shuffle(q.o.map(function(_,i){return i;}));
    var short=q.o.every(function(o){return o.replace(/<[^>]*>/g,'').length<=12;});
    return (q.p?'<p class="prompt">'+tx(q.p)+'</p>':'')+(q.say?sayBox(q.say,q.sayFb):'')+(q.s?'<div class="ctx">'+tx(hlBlank(q.s))+'</div>':'')+(q.big?'<div class="bigw">'+q.big+'</div>':'')+
      '<div class="'+(short?'opts2':'opts1')+'">'+st.ord.map(function(i){
        return '<button class="'+(short?'opt':'opt1')+'" data-i="'+i+'">'+q.o[i]+'</button>';
      }).join('')+'</div>';
  },
  bind:function(q,st,qb,fin){
    if(q.say){bindSay(qb,true);}
    $$('button[data-i]',qb).forEach(function(b){
      b.onclick=function(){
        if(st.done){return;}
        var ok=+b.dataset.i===q.a;
        $$('button[data-i]',qb).forEach(function(o){o.disabled=true;if(+o.dataset.i===q.a){o.classList.add('right');}});
        if(!ok){b.classList.add('wrong');}
        fin(ok,ok?'':'الصواب: '+q.o[q.a],q.why);
      };
    });
  }
};

/* ---- sort: baskets ---- */
Types.sort={
  html:function(q){
    var B=q.b;
    return '<p class="prompt">'+tx(q.p||'صنّف الكلمات: اسحب كل كلمة إلى سلّتها، أو المسها ثم المس السلّة')+'</p><div class="pool"></div>'+
      '<div class="baskets" style="grid-template-columns:repeat('+(B.length>3?2:B.length)+',1fr)">'+B.map(function(b){
        return '<div class="bask" data-k="'+b.id+'" role="button" tabindex="0"><b>'+b.n+'</b><div class="in"></div></div>';
      }).join('')+'</div><div class="tap sh">'+(q.h||'')+'</div>';
  },
  bind:function(q,st,qb,fin){
    var B=q.b,pool=$('.pool',qb),app=document.getElementById('app'),sh=$('.sh',qb);
    var left=q.w.length,mist=0,sel=null,BN={};
    B.forEach(function(b){BN[b.id]=b.n;});
    var ORD2=shuffle(q.w.map(function(_,i){return i;}));
    pool.innerHTML=ORD2.map(function(i,k){var lab=q.w[i].say?'🔊 '+num(k+1):q.w[i].t;return '<button class="chip pw'+(lab.length>10?' lg':'')+'" data-i="'+i+'">'+lab+'</button>';}).join('');
    pool.querySelectorAll('.pw').forEach(function(c){var x=q.w[+c.dataset.i];if(x.say){preClip(x.say);}});
    function chipEl(i){return pool.querySelector('.pw[data-i="'+i+'"]');}
    function select(i){if(i!=null&&q.w[i].say){speak(q.w[i].say,0.7);}sel=i;$$('.pw',pool).forEach(function(c){c.classList.toggle('sel',+c.dataset.i===i);});}
    function assign(i,k){
      var el=chipEl(i);if(!el||st.done){return;}
      if(q.w[i].b===k){
        el.remove();select(null);sh.className='tap sh';sh.textContent='أحسنت!';
        $('.bask[data-k="'+k+'"] .in',qb).insertAdjacentHTML('beforeend','<span class="chip mini'+((q.w[i].full||q.w[i].t).length>10?' lg':'')+'">'+(q.w[i].full||q.w[i].t)+'</span>');
        left--;
        if(left===0){
          fin(mist<=1,mist?'عدد المحاولات الخاطئة: '+num(mist):'','<ul>'+q.w.map(function(x){return '<li><b>'+(x.full||x.t)+'</b> ← '+BN[x.b]+(x.n?': '+tx(x.n):'')+'</li>';}).join('')+'</ul>'+(q.why?'<div>'+q.why+'</div>':''));
        }
      }else{
        mist++;el.classList.add('bad');setTimeout(function(){el.classList.remove('bad');},500);
        sh.className='tap bad sh';sh.textContent='ليست هذه السلّة. فكّر مرة أخرى.';
      }
    }
    var drag=null,ghost=null;
    function basketAt(e){var el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest?el.closest('.bask'):null;}
    function clearOver(){$$('.bask.over',qb).forEach(function(b){b.classList.remove('over');});}
    pool.addEventListener('pointerdown',function(e){
      var c=e.target.closest('.pw');if(!c){return;}
      drag={i:+c.dataset.i,x:e.clientX,y:e.clientY,moved:false,el:c};
      try{c.setPointerCapture(e.pointerId);}catch(x){}
    });
    pool.addEventListener('pointermove',function(e){
      if(!drag){return;}
      if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
        drag.moved=true;ghost=drag.el.cloneNode(true);ghost.classList.add('dragghost');app.appendChild(ghost);drag.el.style.opacity='.35';
      }
      if(drag.moved){
        ghost.style.left=(e.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(e.clientY-ghost.offsetHeight-14)+'px';
        clearOver();var b=basketAt(e);if(b){b.classList.add('over');}
      }
    });
    function end(e,cancel){
      if(!drag){return;}
      var d=drag;drag=null;
      if(ghost){ghost.remove();ghost=null;}
      d.el.style.opacity='';clearOver();
      if(cancel){return;}
      if(d.moved){var b=basketAt(e);if(b){assign(d.i,b.dataset.k);}}
      else{select(sel===d.i?null:d.i);}
    }
    pool.addEventListener('pointerup',function(e){end(e,false);});
    pool.addEventListener('pointercancel',function(e){end(e,true);});
    pool.addEventListener('click',function(e){var c=e.target.closest('.pw');if(c&&e.detail===0){select(sel===+c.dataset.i?null:+c.dataset.i);}});
    $$('.bask',qb).forEach(function(b){
      function go2(){if(sel!=null){assign(sel,b.dataset.k);}}
      b.onclick=go2;
      b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go2();}};
    });
  }
};

/* ---- tap ---- */
Types.tap={
  html:function(q){
    return '<p class="prompt">'+tx(q.p)+'</p><div class="sent">'+q.s.map(function(w,i){return '<button class="chip long tw1" data-i="'+i+'">'+w+'</button>';}).join('')+'</div>'+
      '<button class="btn primary wide chk" disabled>تحقق</button>';
  },
  bind:function(q,st,qb,fin){
    var sel={};
    $$('.tw1',qb).forEach(function(c){
      c.onclick=function(){
        if(st.done){return;}
        var i=+c.dataset.i;if(sel[i]){delete sel[i];}else{sel[i]=1;}
        c.classList.toggle('sel',!!sel[i]);
        $('.chk',qb).disabled=Object.keys(sel).length===0;
      };
    });
    $('.chk',qb).onclick=function(){
      var ok=true;
      $$('.tw1',qb).forEach(function(c){
        var i=+c.dataset.i,want=q.a.indexOf(i)>=0,got=!!sel[i];
        if(want!==got){ok=false;}
        c.disabled=true;c.classList.remove('sel');
        if(want&&got){c.classList.add('right');}else if(got&&!want){c.classList.add('wrong');}else if(want&&!got){c.classList.add('miss');}
      });
      $('.chk',qb).disabled=true;
      fin(ok,ok?'':'الصواب: '+q.a.map(function(i){return '«'+q.s[i]+'»';}).join(' و'),q.why);
    };
  }
};

/* ---- order ---- */
Types.order={
  html:function(q){
    return '<p class="prompt">'+tx(q.p)+'</p><div class="ans"></div><div class="pool"></div><button class="btn primary wide chk" disabled>تحقق</button>';
  },
  bind:function(q,st,qb,fin){
    var pool=shuffle(q.w.map(function(w,i){return {w:w,id:i};})),ans=[];
    function draw(){
      $('.ans',qb).innerHTML=ans.length?ans.map(function(o){return '<button class="chip pa" data-id="'+o.id+'">'+o.w+'</button>';}).join(''):'<span class="tap">المس العناصر بالترتيب</span>';
      $('.pool',qb).innerHTML=pool.map(function(o){return '<button class="chip pp1" data-id="'+o.id+'">'+o.w+'</button>';}).join('');
      $('.chk',qb).disabled=pool.length>0||st.done;
      $$('.pp1',qb).forEach(function(b){b.onclick=function(){if(st.done){return;}var k=pool.findIndex(function(o){return o.id===+b.dataset.id;});ans.push(pool.splice(k,1)[0]);draw();};});
      $$('.pa',qb).forEach(function(b){b.onclick=function(){if(st.done){return;}var k=ans.findIndex(function(o){return o.id===+b.dataset.id;});pool.push(ans.splice(k,1)[0]);draw();};});
    }
    draw();
    $('.chk',qb).onclick=function(){
      var ok=ans.every(function(o,i){return o.id===i;});
      $$('.chip',qb).forEach(function(c){c.disabled=true;});
      $$('.pa',qb).forEach(function(c){c.classList.add(ok?'right':'wrong');});
      fin(ok,ok?'':'الترتيب الصحيح: '+q.w.join(' ← '),q.why);
    };
  }
};

/* ---- match ---- */
Types.match={
  html:function(q){return '<p class="prompt">'+tx(q.p)+'</p><div class="mcols"><div class="mcol ml"></div><div class="mcol mr"></div></div><div class="tap mh">المس عنصراً من كل عمود ليتطابقا</div>';},
  bind:function(q,st,qb,fin){
    var n=q.pairs.length,selL=null,selR=null,done=0,mist=0;
    var oL=q.pairs.map(function(_,i){return i;}),oR=shuffle(oL.slice());
    $('.ml',qb).innerHTML=oL.map(function(i){return '<button class="mbtn" data-s="L" data-i="'+i+'">'+q.pairs[i][0]+'</button>';}).join('');
    $('.mr',qb).innerHTML=oR.map(function(i){return '<button class="mbtn" data-s="R" data-i="'+i+'">'+q.pairs[i][1]+'</button>';}).join('');
    function clearSel(){$$('.mbtn.sel',qb).forEach(function(b){b.classList.remove('sel');});selL=null;selR=null;}
    $$('.mbtn',qb).forEach(function(b){
      b.onclick=function(){
        if(st.done||b.classList.contains('done')){return;}
        var side=b.dataset.s,i=+b.dataset.i;
        $$('.mbtn[data-s="'+side+'"]',qb).forEach(function(o){o.classList.remove('sel');});
        b.classList.add('sel');
        if(side==='L'){selL=i;}else{selR=i;}
        if(selL!=null&&selR!=null){
          var lb=$('.mbtn[data-s="L"][data-i="'+selL+'"]',qb),rb=$('.mbtn[data-s="R"][data-i="'+selR+'"]',qb),mh=$('.mh',qb);
          if(selL===selR){
            lb.classList.remove('sel');rb.classList.remove('sel');lb.classList.add('done');rb.classList.add('done');done++;
            mh.className='tap mh';mh.textContent='أحسنت!';clearSel();
            if(done===n){fin(mist<=1,mist?'عدد المحاولات الخاطئة: '+num(mist):'','<ul>'+q.pairs.map(function(p){return '<li>'+p[0]+' ← '+p[1]+'</li>';}).join('')+'</ul>'+(q.why?'<div>'+q.why+'</div>':''));}
          }else{
            mist++;lb.classList.add('bad');rb.classList.add('bad');mh.className='tap bad mh';mh.textContent='ليسا متطابقين. حاول مرة أخرى.';
            setTimeout(function(){lb.classList.remove('bad');rb.classList.remove('bad');},500);clearSel();
          }
        }
      };
    });
  }
};

/* ---- write: يكتب الطالب الكلمة، ويصحّحها المحرّك ويعلّل ----
   q.it: عنصر من IMLA.item أو {ans,alts,why,notes}؛ q.mode: 'phon' (يظهر نطقها) | 'clue' (جملة بفراغ وتلميح) | 'dict' (إملاء مسموع) */
function WRITE(it,o){var q={t:'write',it:it};if(o){for(var k in o){q[k]=o[k];}}return q;}
function sayLab(it){return '🔊 استمع إلى '+(/\s/.test(String(it.ans||'').trim())?'الجملة':'الكلمة');}
function hlBlank(s){return String(s).replace(/___/g,'<span class="blank">؟</span>');}
Types.write={
  html:function(q){
    var it=q.it,mode=q.mode||'phon';
    var body='';
    if(q.s){body+='<div class="ctx">'+tx(hlBlank(q.s))+'</div>';}
    /* الكلمة تُسمَع دائماً متى أمكن؛ فالوصف وحده (مثل «اسم نبي») لا يحدد الكلمة المطلوبة، فيبقى معناها سطراً مساعداً فقط */
    var sayT=q.sayText||it.full||it.ans,audio=hasClip(sayT)||canSpeak();
    if(mode==='clue'&&!audio){body+='<div class="phbox"><small>المطلوب:</small><span class="clue2">'+tx(q.clue||'')+'</span></div>';}
    else{body+=sayBox(sayT,it.ph?IMLA.spoken(it.ph):'')+(q.clue?'<p class="muted" style="margin:0;text-align:center">معناها: '+tx(q.clue)+'</p>':'');}
    var clueOnly=mode==='clue'&&!audio;
    return '<p class="prompt">'+tx(clueOnly?(q.p||'اكتب الكلمة كتابة صحيحة'):(q.p&&!/^اكتب الكلمة/.test(q.p)?q.p:'اكتب ما تسمعه كتابة صحيحة'))+'</p>'+body+
      '<input class="txt wr" dir="rtl" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="اكتب الإجابة" placeholder="اكتب هنا">'+
      '<small class="kbnote">اكتب بلوحة مفاتيح جهازك العربية.</small>'+
      '<button class="btn primary wide chk">تحقّق</button>';
  },
  bind:function(q,st,qb,fin){
    var inp=$('.wr',qb),it=q.it;
    bindSay(qb,true);
    function go(){
      if(st.done){return;}
      var r=IMLA.check(inp.value,it,S.set.school||'all');
      if(!IMLA.norm(inp.value)){inp.focus();return;}
      inp.disabled=true;$('.chk',qb).disabled=true;
      inp.classList.add(r.ok?'right':'wrong');
      var show='<span class="ansbig">'+(it.ph?HW(it.ph):esc(it.full||it.ans))+'</span>';

function HUNT(p,w,o){var q={t:'hunt',p:p,w:w};if(o){for(var k in o){q[k]=o[k];}}return q;}
Types.hunt={
  html:function(q){
    var nb=q.w.filter(function(x){return x.bad;}).length;
    return '<p class="prompt">'+tx(q.p||'في النص كلمات كُتبت خطأً. المسها ثم اضغط «تحقّق».')+'</p><div class="huntp">'+q.w.map(function(x,i){return '<button class="hw1" data-i="'+i+'">'+x.t+'</button>';}).join(' ')+'</div>'+
      '<div class="tap">عدد الأخطاء في النص: '+num(nb)+'</div><button class="btn primary wide chk">تحقّق</button>';
  },
  bind:function(q,st,qb,fin){
    var sel={};
    $$('.hw1',qb).forEach(function(b){b.onclick=function(){if(st.done){return;}var i=+b.dataset.i;if(sel[i]){delete sel[i];}else{sel[i]=1;}b.classList.toggle('sel',!!sel[i]);};});
    $('.chk',qb).onclick=function(){
      if(st.done){return;}
      var ok=true,found=0,miss=0,fp=0;
      $$('.hw1',qb).forEach(function(b){var i=+b.dataset.i,x=q.w[i],g=!!sel[i];b.disabled=true;b.classList.remove('sel');
        if(x.bad&&g){b.classList.add('right');found++;b.innerHTML='<s>'+x.t+'</s> '+x.fix;}
        else if(x.bad&&!g){b.classList.add('miss');miss++;ok=false;b.innerHTML='<s>'+x.t+'</s> '+x.fix;}
        else if(!x.bad&&g){b.classList.add('wrong');fp++;ok=false;}});
      $('.chk',qb).disabled=true;
      var why='<ul>'+q.w.filter(function(x){return x.bad;}).map(function(x){return '<li><b>'+x.t+'</b> ← <b>'+x.fix+'</b>: '+tx(x.why||'')+'</li>';}).join('')+'</ul>';
      fin(ok,ok?'':'اكتشفتَ '+num(found)+' من '+num(found+miss)+(fp?'، ولمستَ '+cnt(fp,'okword','j'):''),why);
    };
  }
};

    if(step>=last){rows.push('<div class="al-res"><span class="al-word">'+esc(x.w)+'<b class="'+(r.c==='ا'?'sa':'sy')+'">'+r.c+'</b></span><p>'+IMLA.LYW[r.r]+'</p></div>');}
    $('.al-stage',h).innerHTML=rows.join('');
    $('.al-nx',h).textContent=step>=last?(cur<it.length-1?'الكلمة التالية':'من البداية'):'الخطوة التالية';
  }
  $('.al-nx',h).onclick=function(){var x=it[cur],last=(x.k==='v'||x.k==='n')?4:2;if(step>=last){cur=(cur+1)%it.length;step=0;}else{step++;}draw();};
  $$('.alw',h).forEach(function(b){b.onclick=function(){cur=+b.dataset.j;step=0;draw();};});
  draw();
};

  draw();
};

/* ================= شبكة الهمزة، واكتشف القاعدة، وهل يتصل الحرف؟ ================= */
var HKN={a:'فتحة',u:'ضمة',i:'كسرة',o:'سكون'};
var HCH={a:'َ',u:'ُ',i:'ِ',o:'ْ'};
/* ---------- شبكة الهمزة: الحروف عُقد، والخطوط تربط الهمزة بحركتها وبما قبلها ثم بالكرسي ---------- */
function netStages(n){
  var S=[];
  S.push('pos');
  if(n.pos==='i'){S.push('init');}
  else if(n.pos==='f'){S.push('prev');if(n.tnRule&&(n.tnRule==='tn-con'||n.tnRule==='tn-nocon'||n.tnRule==='suf-con'||n.tnRule==='suf-nocon')){S.push('conn');}}
  else{S.push('both');if(['m-ya','m-alif-a','m-alif-u','m-waw-a','m-waw-u','m-lin'].indexOf(n.rule)>=0){S.push('special');}else{S.push('compare');}}
  S.push('chair');S.push('done');
  return S;
}
Comp.hamzanet=function(h,st){
  var words=st.words,cur=0,stage=0,W=null,n=null,T=null,S=null,got={},lastMid='';
  h.innerHTML=(words.length>1?'<div class="fpick hn-w">'+chipBtns(words.map(function(p){return IMLA.write(p).plain;}),'hnw',0)+'</div>':'')+
    '<div class="hn-wrap"><svg class="hn-svg" aria-hidden="true"></svg><div class="hn-pos"></div><div class="hn-row"></div><div class="hn-chips"></div><div class="hn-mid"></div><div class="hn-chairs"></div></div>'+
    '<div class="note hn-n" aria-live="polite"></div><div class="row2"><button class="btn ghost hn-all">اعرض الحل كاملاً</button><button class="btn primary hn-nx">التالي</button></div>';
  var svg=$('.hn-svg',h),wrap=$('.hn-wrap',h);
  function load(){
    var ph=words[cur];W=IMLA.write(ph);T=IMLA.parse(ph);
    n=W.notes.filter(function(x){return x.pos!=='i';}).pop()||W.notes[0];
    if(st.focus==='first'){n=W.notes[0];}
    S=netStages(n);stage=0;got={};lastMid='';
    $$('.hnw',h).forEach(function(b,i){b.classList.toggle('on',i===cur);});
    $('.hn-row',h).innerHTML=T.map(function(t,k){if(t.sp){return '<span class="hn-gap"></span>';}var hz=k===n.k;return '<span class="hn-l'+(hz?' hz0':'')+(k===n.k-1&&n.pos!=='i'?' prv':'')+'" data-k="'+k+'"><b>'+(hz?'ء':t.c)+(t.sh?'ّ':'')+(t.tn?{a:'ً',u:'ٌ',i:'ٍ'}[t.tn]:(t.h?HCH[t.h]:''))+'</b></span>';}).join('');
    draw();
  }
  function el(s){return $(s,wrap);}
  function line(a,b,cls,cv){
    if(!a||!b){return '';}
    var r0=wrap.getBoundingClientRect(),ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    var x1=ra.left+ra.width/2-r0.left,y1=ra.bottom-r0.top,x2=rb.left+rb.width/2-r0.left,y2=rb.top-r0.top;
    if(cv==='up'){y1=ra.top-r0.top;y2=rb.bottom-r0.top;}
    var my=(y1+y2)/2;
    return '<path class="hn-ln '+(cls||'')+'" d="M'+x1+' '+y1+' C'+x1+' '+my+','+x2+' '+my+','+x2+' '+y2+'"/>';
  }
  function chip(cls,txt){return '<span class="hn-chip '+cls+'">'+txt+'</span>';}
  function draw(){
    var sg=S[stage],k=n.k,hh=n.hh||'a',P=T[k-1],note='',mid='',chips='',ask='';
    var posN={i:'أول الكلمة',m:'وسط الكلمة',fm:'وسط الكلمة (اتصلت بها لاحقة)',f:'آخر الكلمة'}[n.pos];
    /* شريط الموضع */
    $('.hn-pos',h).innerHTML=stage>=1||got.pos?'<span class="hn-tag on">الموضع: '+posN+'</span>':'<span class="hn-tag">أين تقع الهمزة؟</span>';
    /* الشرائح تحت الحروف */
    if(stage>=2||sg==='init'||(stage>=1&&S[1]!=='init')){
      chips+=chip('ch-h'+(n.pos==='f'&&n.pos!=='i'?' off':''),'حركة الهمزة: <b>'+(n.pos==='f'?'لا تهمّ':HKN[hh])+'</b>');
      if(n.pos!=='i'&&P){chips+=chip('ch-p','ما قبلها «'+P.c+'»: <b>'+(n.ph==='o'?(P.c==='ا'||(!P.h&&(P.c==='و'||P.c==='ي'))?'حرف مدّ ساكن':'ساكن'):HKN[n.ph])+'</b>');}
    }
    $('.hn-chips',h).innerHTML=chips;
    if(sg==='pos'){
      ask='<div class="hn-ask"><b>أين تقع الهمزة في الكلمة؟</b><div class="seg">'+['أول','وسط','آخر'].map(function(x){return '<button class="btn ghost sm hn-a" data-a="'+x+'">'+x+' الكلمة</button>';}).join('')+'</div></div>';
      note='الهمزة المضيئة في الكلمة. حدّد موضعها أولاً؛ فلكل موضع قاعدته.';
    }else if(sg==='init'){
      mid='<div class="hn-win">في أول الكلمة ← <b>على الألف دائماً</b>'+(hh==='i'?' (تحتها لأنها مكسورة: إ)':' (فوقها: أ)')+'</div>';
      note=n.pref?'دخلت عليها سابقة، لكنها بقيت في حكم الهمزة الأولى.':'الهمزة الأولى لا تنظر إلى غيرها.';
    }else if(sg==='prev'){
      mid='<div class="hn-win">متطرفة ← <b>انظر إلى ما قبلها فقط</b>: '+(n.ph==='o'?'ساكن ← على السطر':HKN[n.ph]+' ← '+({a:'الألف',u:'الواو',i:'النبرة'})[n.ph])+'</div>';
      note='حركة الهمزة المتطرفة تتغيّر بالإعراب، لذلك نهملها (شُطبت) ونربطها بما قبلها.';
    }else if(sg==='conn'){
      var c=IMLA.connects(P.c);
      mid='<div class="hn-win">ومعها ألف '+(n.ext==='tn'?'التنوين':'اللاحقة')+': هل «'+P.c+'» يتصل بما بعده؟ <span class="hn-join">'+P.c+(c?'‍':'')+'<i>'+(c?'ـ':'|')+'</i></span> <b>'+(c?'نعم ← تُرفع الهمزة إلى نبرة: ئا':'لا ← تبقى على السطر: ءا')+'</b></div>';
      note=c?'الحرف المتصل يمدّ يده إلى ما بعده، فتجلس الهمزة على سنّ (نبرة).':'الحرف المنفصل لا يتصل، فتبقى الهمزة مفردة على السطر.';
    }else if(sg==='both'){
      note='ربطنا الهمزة بحركتها، والحرف الذي قبلها بحركته. الآن تتنافس الحركتان.';
    }else if(sg==='compare'){
      var w=n.win||hh;
      if(!got.cmp){ask='<div class="hn-ask"><b>أي الحركتين أقوى؟</b><div class="seg"><button class="btn ghost sm hn-c" data-c="h">حركة الهمزة ('+HKN[hh]+')</button><button class="btn ghost sm hn-c" data-c="p">حركة ما قبلها ('+HKN[n.ph]+')</button>'+(hh===n.ph?'<button class="btn ghost sm hn-c" data-c="eq">متساويتان</button>':'')+'</div><small class="muted">الترتيب: كسرة ← ضمة ← فتحة ← سكون</small></div>';}
      mid='<div class="hn-win'+(got.cmp?' on':'')+'">'+(got.cmp?'الأقوى: <b>'+HKN[w]+'</b> ← '+(w==='o'?'—':({i:'النبرة ئ',u:'الواو ؤ',a:'الألف أ'})[w]):'؟')+'</div>';
      note=got.cmp?got.cmp:'قارن الحركتين على سلّم القوة.';
    }else if(sg==='special'){
      var sp={'m-ya':'قبلها ياء ساكنة ← على النبرة دائماً','m-alif-a':'مفتوحة بعد ألف ← على السطر (لا تجتمع ألفان)','m-alif-u':'مضمومة بعد ألف ← على الواو','m-waw-a':'مفتوحة بعد واو مدّ ساكنة ← على السطر','m-waw-u':'مضمومة بعد واو ساكنة ← على السطر','m-lin':'مفتوحة بعد واو لين ← على الألف (ويجوز السطر)'}[n.rule];
      mid='<div class="hn-win on">حالة خاصة: <b>'+sp+'</b></div>';note='هنا لا نحتاج إلى السلّم؛ للحرف الذي قبلها حكم خاص.';
    }else if(sg==='chair'){
      note=got.chair?got.chair:'المس الكرسي الذي تجلس عليه الهمزة.';mid=lastMid;
    }else if(sg==='done'){
      $('.hn-row',h).innerHTML='<div class="hn-final">'+HW(words[cur])+'</div>';
      mid='';note=tx(n.why)+(W.alts.length?'<br><small>ويجوز: '+W.alts.map(function(a){return '«'+a.out+'»';}).join('، ')+'</small>':'');
    }
    if(mid&&sg!=='chair'){lastMid=mid.replace('hn-win"','hn-win on"');}
    $('.hn-mid',h).innerHTML=ask+mid;
    $('.hn-chairs',h).innerHTML=(sg==='chair'||sg==='done')?chairsSVG(sg==='done'||got.chairOk?n.seat:'x'):'';
    if(sg==='chair'&&!got.chairOk){$$('.hn-chairs .ch',h).forEach(function(g,i){g.style.cursor='pointer';g.addEventListener('click',function(){var seat=['أ','ؤ','ئ','ء'][i],want=n.seat==='إ'||n.seat==='آ'?'أ':n.seat;
      if(seat===want){got.chairOk=1;got.chair='<b>أحسنت!</b> '+SEATLAB[n.seat]+'.';stage++;draw();}else{got.chair='ليس هذا الكرسي. ارجع إلى الخطوة السابقة: '+($('.hn-win',h)?$('.hn-win',h).textContent:'');$('.hn-n',h).innerHTML=got.chair;g.classList.add('bad');}});});}
    $('.hn-n',h).innerHTML=note;
    $('.hn-nx',h).textContent=sg==='done'?(cur<words.length-1?'الكلمة التالية':'من البداية'):'التالي';
    $('.hn-nx',h).disabled=(sg==='pos'&&!got.pos)||(sg==='compare'&&!got.cmp)||(sg==='chair'&&!got.chairOk);

Comp.discover=function(h,st){
  var it=st.items,cur=0,res=[];
  h.innerHTML='<div class="dc-bar"><i></i></div><div class="dc-card"></div><div class="dc-rule" hidden></div>';
  function seatOpts(n){var o=['أ','ؤ','ئ','ء'];if(n.pos==='i'){o=['أ','إ','ؤ','ئ'];}if(n.seat==='آ'){o=['آ','أ','ء','ئ'];}return o;}
  function draw(){
    $('.dc-bar i',h).style.width=(cur/it.length*100)+'%';
    if(cur>=it.length){return finish();}
    var ph=it[cur],W=IMLA.write(ph),n=W.notes.filter(function(x){return x.pos!=='i';}).pop()||W.notes[0];if(st.focus==='first'){n=W.notes[0];}
    $('.dc-card',h).innerHTML='<div class="dc-n">'+num(cur+1)+' / '+num(it.length)+'</div>'+sayBox(W.out,IMLA.spoken(ph))+'<p><b>على أي صورة تُكتب الهمزة'+(W.notes.length>1?' المضيئة':'')+'؟</b></p><div class="dc-opts">'+seatOpts(n).map(function(s){return '<button class="dc-o" data-s="'+s+'">'+s+'</button>';}).join('')+'</div><div class="dc-f"></div>';
    bindSay($('.dc-card',h),true);
    $$('.dc-o',h).forEach(function(b){b.onclick=function(){
      if(h._lock){return;}var ok=b.dataset.s===n.seat;b.classList.add(ok?'right':'wrong');
      if(!ok){$$('.dc-o',h).forEach(function(x){if(x.dataset.s===n.seat){x.classList.add('right');}});}
      res.push({ph:ph,ok:ok,n:n});h._lock=true;
      $('.dc-f',h).innerHTML='<div class="dc-w">'+HW(ph)+'</div><small>'+shortWhy(n)+'</small>';
      later(function(){h._lock=false;cur++;draw();},ok?1300:2400);
    };});
  }
  function finish(){
    var ok=res.filter(function(r){return r.ok;}).length,by={};
    res.forEach(function(r){(by[r.n.seat]=by[r.n.seat]||[]).push(r);});
    $('.dc-card',h).innerHTML='<div class="dc-sum"><b>أصبتَ '+num(ok)+' من '+num(res.length)+'.</b> لاحظ الكلمات مجمّعة بحسب الصورة:</div><div class="dc-groups">'+Object.keys(by).map(function(s){return '<div class="dc-g"><span class="dc-seat">'+tx('⦃'+s+'⦄')+'</span>'+by[s].map(function(r){return HW(r.ph);}).join(' ')+'</div>';}).join('')+'</div><button class="btn ghost sm dc-again">أعد التجربة</button>';
    var R=$('.dc-rule',h);R.hidden=false;R.innerHTML='<b>💡 القاعدة التي اكتشفتها:</b> '+tx(st.rule);
    $('.dc-again',h).onclick=function(){cur=0;res=[];R.hidden=true;draw();};
  }
  draw();
};

  var nodes=K.map(function(k,i){var a=-Math.PI/2+i*2*Math.PI/n,x=cx+R*Math.cos(a)*1.25,y=cy+R*Math.sin(a);

  return '<div class="rmap" style="aspect-ratio:'+W+'/'+H+'"><svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+out+'</svg><div class="rm-c">'+tx(root.t)+'</div>'+nodes+'</div><div class="note rm-d" aria-live="polite" hidden></div>';
}

/* ---------- الكلمة مع إبراز الهمزة ---------- */
function joinsAfter(c){return !!c&&/[ء-ي]/.test(c)&&'اأإآدذرزوؤءةى'.indexOf(c)<0;}
function render(out,at,seat,q,mark){
  var res='',k=-1,ch=out.split(''),ZWJ='‍';
  for(var i=0;i<ch.length;i++){
    var c=ch[i],isM=MK.test(c);
    if(!isM){k++;}
    if(!isM&&k===at){
      var j=i+1,m='';while(j<ch.length&&MK.test(ch[j])){m+=ch[j];j++;}
      var p=i-1;while(p>=0&&MK.test(ch[p])){p--;}
      var prev=p>=0?ch[p]:'',nx=j<ch.length?ch[j]:'',inJ=joinsAfter(prev),outJ=joinsAfter(c)&&nx&&nx!==' ';
      if(q){res+='<span class="wf-q">؟</span>';}
      else{res+=(inJ?ZWJ:'')+'<span class="wf-hz '+(SEATC[seat]||'wf-sL')+'"'+(mark?' data-r="hz"':'')+'>'+(inJ?ZWJ:'')+c+m+(outJ?ZWJ:'')+'</span>'+(outJ?ZWJ:'');}
      i=j-1;
    }else{res+=c;}
  }
  return res;
}
function made(s){return F.make(s||S);}
function seatOf(m){return F.seatOf(m);}
function atOf(m){
  var b=m.out.replace(/[ً-ّْٰ]/g,'');
  if(m.lame){return m.letter?b.lastIndexOf(m.letter):-1;}
  if(!m.note){return -1;}
  if(b.charAt(m.note.at)===m.note.seat){return m.note.at;}
  return b.indexOf(m.note.seat);
}

/* ---------- الجذور والأوزان ---------- */
function bare(s){return String(s).replace(/[ً-ّْٰ\s]/g,'').replace(/[أإآؤئ]/g,'ء').replace(/ى/g,'ي');}
function visibleRoots(){
  var q=bare(rq);
  return F.ROOTS.filter(function(R){
    if(posF!=='all'&&R.pos!==posF){return false;}
    if(!q){return true;}
    if(bare(R.r).indexOf(q)>=0||bare(R.m).indexOf(q)>=0){return true;}
    return R.forms.some(function(f){return bare(F.labelOf(R,f)).indexOf(q)>=0;});
  });
}
function rootsUI(lock){

  R_('pos').hidden=!!lock;R_('rq').hidden=!!lock;

  }).join(''):'<div class="wf-rnone">لا جذر يطابق البحث. جرّب كلمة من الجذر، مثل «سؤال» أو «قرأ».</div>';

  }

function lane(name,v,win){var w=v==null?0:(STR[v]+1)*25;return '<div class="wf-lane'+(win?' wf-win':'')+'"><span>'+name+'</span><span class="wf-bar"><i style="width:'+w+'%"></i></span><span>'+(v==null?'—':(win?'<b>'+HV[v]+'</b>':HV[v]))+'</span></div>';}
function raceUI(m){
  if(m.lame){var R=m.root;return '<div class="wf-race"><h3>أصل الألف اللينة</h3><div class="wf-verdict">الجذر «'+R.r+'» آخره <span class="wf-seat wf-sLy">'+R.org+'</span> فالألف في الماضي '+(R.org==='و'?'<span class="wf-seat wf-sLy">ا</span> قائمة':'<span class="wf-seat wf-sLy">ى</span> مقصورة')+'</div></div>';}

  if(n.rule==='m-strong'||n.rule==='m-i'){
    var hh=n.hh,ph=n.ph==null?'o':n.ph,win=n.win||(STR[hh]>=STR[ph]?hh:ph),hwin=STR[hh]>=STR[ph];

  }
  var SP={'m-alif-a':['بعد ألف المدّ لا سباق','المفتوحة بعد ألف تُكتب على السطر'],'m-alif-u':['بعد ألف المدّ لا سباق','المضمومة بعد ألف تُكتب على الواو'],
    'm-waw-a':['بعد واو ساكنة لا سباق','الهمزة بعد واو ساكنة تُكتب على السطر'],'m-waw-u':['بعد واو ساكنة لا سباق','الهمزة بعد واو ساكنة تُكتب على السطر'],
    'm-ya':['بعد ياء ساكنة لا سباق','الهمزة بعد ياء ساكنة تُكتب على النبرة']}[n.rule]||['قاعدة خاصة','تحسمها القاعدة الخاصة'];
  return '<div class="wf-race"><h3>'+SP[0]+'</h3>'+lane('حركة الهمزة',n.hh,true)+'<div class="wf-verdict">'+SP[1]+' ← '+sc+'</div></div>';
}

function draw(anim){
  var m=made(),seat=seatOf(m),at=atOf(m);
  S=Object.assign({},S,m.s);

  R_('strip').innerHTML=m.parts.map(function(p,i){return '<span class="wf-piece'+(i===(m.s.pre?1:0)?' wf-main':'')+'">'+esc(p)+'</span>';}).join('');
  R_('word').innerHTML=at>=0?render(m.out,at,seat,hide,true):esc(m.out);
  R_('race').innerHTML=hide?'':raceUI(m);
  R_('why').textContent=hide?'':(m.why||'');

  R_('score').textContent=pred&&pscore[1]?'أصبت '+num(pscore[0])+' من '+num(pscore[1]):'';

    var el=R_('hz');if(el){el.classList.remove('wf-jump');void el.offsetWidth;el.classList.add('wf-jump');
      var g=document.createElement('span');g.className='wf-ghost';g.setAttribute('aria-hidden','true');g.textContent=prevSeat;
      var r=el.getBoundingClientRect(),w=R_('word').getBoundingClientRect();
      g.style.right=(w.right-r.right+r.width/2-10)+'px';g.style.top=(r.top-w.top)+'px';R_('word').appendChild(g);setTimeout(function(){g.remove();},950);}
  }
  if(!hide){prevSeat=seat;}

}

function partsOf(s){var R=F.root(s.root),f=F.form(R,s.form),n=F.norm(s),o={'الجذر':R.r,'الوزن':F.labelOf(R,f)};
  if(f.k==='n'){o['البادئة']=(F.NPRE.filter(function(x){return x.id===n.pre;})[0]||{n:'—'}).n;o['الإعراب']=F.CASE[n.cas].n;o['الضمير']=(F.SUF.filter(function(x){return x.id===n.suf;})[0]||{n:'—'}).n;}
  else{o['الفاعل']=F.SUBJ.filter(function(x){return x.id===n.subj;})[0].n;o['البادئة']=(F.VPRE.filter(function(x){return x.id===n.pre;})[0]||{n:'—'}).n;}
  return o;}

/* ---------- الألغاز ---------- */
var PZ=null,PZL=[],PZI=0,PZDONE=[];
var CK=['form','pre','cas','suf','subj'],CKN={form:'الوزن',pre:'البادئة',cas:'الإعراب',suf:'الضمير',subj:'الفاعل'};
function stateKey(s){return JSON.stringify(F.norm(s));}
function diffKeys(a,b){a=F.norm(a);b=F.norm(b);return CK.filter(function(k){return (a[k]||'')!==(b[k]||'');});}
var CACHE={};
function statesOf(rid){if(!CACHE[rid]){CACHE[rid]=F.allStates(rid).map(function(x){var m=F.make(x.s);return {s:x.s,seat:seatOf(m),out:m.out};});}return CACHE[rid];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function genPuzzles(){
  var out=[],H=F.ROOTS.filter(function(R){return R.pos!=='l';}).map(function(R){return R.id;});
  /* صنف أ: اصنع من الجذر كلمة همزتها على كرسي معيّن (يُفضَّل الكرسي النادر في الجذر) */
  shuffle(H.slice()).forEach(function(rid){
    if(out.length>=5){return;}
    var st=statesOf(rid),seats={};st.forEach(function(x){if(x.seat&&x.seat!=='إ'){seats[x.seat]=(seats[x.seat]||0)+1;}});
    var c=Object.keys(seats);if(c.length<2){return;}
    c.sort(function(a,b){return seats[a]-seats[b];});
    var target=c[Math.floor(Math.random()*Math.min(2,c.length))];
    var start=st.filter(function(x){return x.seat!==target;});start=start[Math.floor(Math.random()*start.length)];
    out.push({t:'make',root:rid,target:target,start:start.s,sols:seats[target]});
  });
  /* صنف ب: غيّر قطعة واحدة لتنقل الهمزة */
  var tries=0,B=[];
  while(B.length<5&&tries<600){
    tries++;
    var rid=H[Math.floor(Math.random()*H.length)],st=statesOf(rid),a=st[Math.floor(Math.random()*st.length)];
    if(!a.seat||B.some(function(p){return p.root===rid;})){continue;}
    var moves=st.filter(function(b){return b.seat&&b.seat!==a.seat&&b.seat!=='إ'&&diffKeys(a.s,b.s).length===1;});
    if(!moves.length){continue;}
    var tg=moves[Math.floor(Math.random()*moves.length)],ways={};
    moves.filter(function(b){return b.seat===tg.seat;}).forEach(function(b){ways[diffKeys(a.s,b.s)[0]]=1;});
    B.push({t:'one',root:rid,target:tg.seat,start:a.s,from:a.seat,fromOut:a.out,ways:Object.keys(ways)});
  }
  var L=[];for(var i=0;i<Math.max(out.length,B.length);i++){if(out[i]){L.push(out[i]);}if(B[i]){L.push(B[i]);}}
  return L;
}
function startPuzzle(i){
  PZI=i;PZ=PZL[i];PZ.state='open';PZ.hint=false;
  S=Object.assign({subj:'hw',pre:'',cas:'u',suf:''},PZ.start);prevSeat=null;predDone=true;draw(false);
}
function pzText(p){
  if(p.t==='make'){return 'اصنع من جذر «'+F.root(p.root).r+'» كلمةً همزتُها '+SEATN[p.target]+' ('+p.target+')';}
  return 'همزة «'+p.fromOut+'» '+SEATN[p.from]+'. غيّر قطعة واحدة فقط لتصير '+SEATN[p.target]+' ('+p.target+')';
}
function pzUI(){
  var p=PZ,box=R_('puz');box.hidden=false;
  var dots=PZL.map(function(_,i){return '<i class="'+(PZDONE[i]?'wf-done':(i===PZI?'wf-cur':''))+'"></i>';}).join('');
  var html='<div class="wf-puz"><div class="wf-row" style="justify-content:space-between"><span class="wf-k">'+(p.t==='make'?'اصنع':'قطعة واحدة')+' · لغز '+num(PZI+1)+' من '+num(PZL.length)+'</span><span class="wf-dots">'+dots+'</span></div><p class="wf-t">'+pzText(p)+'</p>';
  if(p.state==='ok'){html+='<div class="wf-fb wf-ok">'+p.msg+'</div><div class="wf-row">'+(PZI<PZL.length-1?'<button class="wf-btn wf-pri" data-a="next">اللغز التالي</button>':'<button class="wf-btn wf-pri" data-a="new">جولة جديدة</button>')+'</div>';}
  else{
    if(p.state==='no'){html+='<div class="wf-fb wf-no">'+p.msg+'</div>';}
    if(p.hint){html+='<div class="wf-fb wf-hint">'+(p.t==='make'?'جرّب الأوزان المختلفة، وغيّر الإعراب والضمائر والفاعل. يحقق المطلوب '+cnt(p.sols,W_FORM)+'.':'القطعة التي تحلّه: '+p.ways.map(function(k){return CKN[k];}).join(' أو ')+'.')+'</div>';}
    html+='<div class="wf-row"><button class="wf-btn wf-pri" data-a="chk">تحقّق</button>'+(p.t==='one'?'<button class="wf-btn" data-a="reset">أعد البداية</button>':'')+'<button class="wf-btn" data-a="hint"'+(p.hint?' disabled':'')+'>تلميح</button></div>';
  }
  box.innerHTML=html+'</div>';

/* ---------- practice sessions ---------- */
var Q=null,TEST_N=20,TOPIC_N=20;
function topicQs(lv,ti){
  var T=CONTENT[lv].topics[ti];
  return expand(T.qs||[]).filter(Boolean).map(function(q){if(!q.sk&&T.sk){q.sk=T.sk;}q.tp=T.id;return q;});
}
function byD(qs){return qs.map(function(q,i){return [q,(q.d||1)+Math.random()*0.9];}).sort(function(a,b){return a[1]-b[1];}).map(function(x){return x[0];});}
/* اختبار المستوى: سؤال واحد على الأقل لكل قاعدة (وسم) في المستوى، ثم أسئلة متنوعة، مرتبة من السهل إلى الصعب */
var LVDIFF=[1,1,2,2,2,3,3,3,3];
function levelTest(lv){
  var C0=CONTENT[lv],by={},out=[];
  C0.topics.forEach(function(T,ti){(T.items||[]).forEach(function(it){var k=it.tag||('t'+ti);(by[k]=by[k]||[]).push([it,T]);});});
  Object.keys(by).forEach(function(k){var x=rnd(by[k]),q=anyQ(x[0],Math.max(1,LVDIFF[lv]+(Math.random()<0.4?1:0)));if(q){q.tp=x[1].id;if(!q.sk){q.sk=x[0].sk||x[1].sk;}q.tag=k;out.push(q);}});
  var extra=[];C0.topics.forEach(function(T,ti){extra=extra.concat(shuffle(topicQs(lv,ti)).slice(0,3));});
  (C0.extra?expand(C0.extra):[]).forEach(function(q){extra.push(q);});
  extra=shuffle(extra.filter(function(q){return q.t==='hunt'||q.t==='sort'||q.t==='match'||(q.tag==='case')||Math.random()<0.5;}));
  var N=Math.max(TEST_N,out.length+6);
  out=out.concat(extra).slice(0,N);
  var all=[];Object.keys(by).forEach(function(k){all=all.concat(by[k]);});
  for(var g=0;out.length<N&&g<60;g++){var x=rnd(all),q=anyQ(x[0],Math.max(1,LVDIFF[lv]));if(q){q.tp=x[1].id;if(!q.sk){q.sk=x[0].sk||x[1].sk;}out.push(q);}}
  return byD(shuffle(out));
}
function startSession(o){

  else{qs=levelTest(o.lv);title='اختبار المستوى';}
  if(!qs.length){home();return;}

  tabs.hidden=true;if(o.lv!=null){S.lastLv=o.lv;}

}

/* ---------- radar ---------- */
function radar(vals){
  var cx=170,cy=150,R=98,N=vals.length,ns='',i;
  function pt(k,r){var a=-Math.PI/2+2*Math.PI*k/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  [0.25,0.5,0.75,1].forEach(function(f){
    ns+='<polygon class="g" points="'+vals.map(function(_,k){return pt(k,R*f).join(',');}).join(' ')+'"/>';
  });
  vals.forEach(function(v,k){var p=pt(k,R);ns+='<line class="ax" x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'"/>';});
  ns+='<polygon class="pl" points="'+vals.map(function(v,k){return pt(k,R*(v.v==null?0.02:v.v)).join(',');}).join(' ')+'"/>';
  vals.forEach(function(v,k){
    var p=pt(k,R*(v.v==null?0.02:v.v));ns+='<circle class="'+(v.v==null?'na':'dot')+'" cx="'+p[0]+'" cy="'+p[1]+'" r="3.5"/>';
    var l=pt(k,R+22),anc=l[0]<cx-8?'end':(l[0]>cx+8?'start':'middle');
    ns+='<text x="'+l[0]+'" y="'+(l[1]+4)+'" text-anchor="'+anc+'">'+v.n+'</text>';
  });
  return '<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="خريطة القدرات">'+ns+'</svg>';
}
function skillVals(src){
  return SKILLS.map(function(s){var v=src[s.id];return {n:s.n,v:v&&v[1]?v[0]/v[1]:null,st:v};});
}
function barsH(vals){
  return vals.map(function(v){
    return '<div class="rbar"><span class="lbl">'+v.n+'</span><div class="meter"><i style="width:'+(v.v==null?0:Math.round(v.v*100))+'%"></i></div><span class="v">'+(v.v==null?'—':num(Math.round(v.v*100))+'٪')+'</span></div>';
  }).join('');
}

function runPlacement(){
  var st={L:0,k:0,ok:0,idk:0,per:[],sk:{},asked:0,wrong:[],qs:null};
  function block(){
    st.qs=shuffle(DB.diag.filter(function(d){return d.lv===st.L;})).slice(0,5);st.k=0;st.ok=0;st.idk=0;
  }
  function ask(){
    var d=st.qs[st.k],q=JSON.parse(JSON.stringify(d.q));q.sk=d.sk;q.noMist=false;
    view.innerHTML='<div class="sess"><div class="top"><button class="x" id="quit" aria-label="خروج">×</button><div class="bar"><i style="width:'+Math.min(100,(st.asked/25)*100)+'%"></i></div><span class="cnt">'+num(st.asked+1)+'</span></div><div class="card qcard"></div><div class="tap">لن تظهر الإجابة الصحيحة الآن؛ سترى أخطاءك مع شرحها في النتيجة.</div></div>';
    $('#quit').onclick=function(){go('home');};
    mountQ($('.qcard',view),q,{silent:true,idk:true,noHint:true,onEnd:function(ok,s){
      st.asked++;
      var e=st.sk[d.sk]||(st.sk[d.sk]=[0,0]);e[1]++;if(ok){e[0]++;st.ok++;}else{st.wrong.push({q:q,idk:s.idk});}
      if(s.idk){st.idk++;}
      later(next,350);
    }});
  }
  function next(){
    st.k++;
    var early=st.idk>=2;
    if(st.k>=st.qs.length||early){
      st.per[st.L]=[st.ok,st.k];
      var pass=!early&&st.ok>=4;
      if(pass&&st.L<LEVELS.length-1){st.L++;block();ask();return;}
      finish(pass?LEVELS.length-1:st.L,pass);
      return;
    }
    ask();
  }
  function finish(rec,allPassed){
    S.rec=rec;
    S.plc={per:st.per,sk:st.sk,rec:rec,d:today()};
    for(var k in st.sk){var a=S.sk[k]||(S.sk[k]=[0,0]);a[0]+=st.sk[k][0];a[1]+=st.sk[k][1];}
    st.wrong.forEach(function(w){recMist(w.q,false);});
    S.lastLv=hasContent(rec)?rec:0;save();
    setBar(rec,'نتيجة الاختبار');
    var vals=skillVals(st.sk),strong=vals.filter(function(v){return v.v!=null&&v.v>=0.8;}).map(function(v){return v.n;}),weak=vals.filter(function(v){return v.v!=null&&v.v<0.6;}).map(function(v){return v.n;});
    var passed=[];st.per.forEach(function(p,i){if(p&&(i<rec||allPassed)){passed.push('«'+LEVELS[i].n+'» ('+num(p[0])+' من '+num(p[1])+')');}});
    var failed=(!allPassed&&st.per[rec])?'وتعثّرتَ في مستوى «'+LEVELS[rec].n+'» ('+num(st.per[rec][0])+' من '+num(st.per[rec][1])+').':'';
    var reason=(passed.length?'اجتزتَ '+(passed.length>1?'مستويات ':'مستوى ')+passed.join(' و')+'. ':'لم تكتمل إجاباتك الصحيحة في المستوى الأول بعد. ')+failed+
      (strong.length?' أنت قوي في: '+strong.join('، ')+'.':'')+(weak.length?' ويحتاج إلى تقوية: '+weak.join('، ')+'.':'');
    var soon=!hasContent(rec);
    var html='<h2>نتيجة الاختبار</h2><section class="hero"><span class="eyebrow">ننصحك بالبدء من</span><div class="big">'+LEVELS[rec].n+'</div><p class="muted">'+LEVELS[rec].d+'</p><p><b>سبب التوصية:</b> '+reason+'</p>'+
      (soon?'<div class="tip">محتوى هذا المستوى قيد الإعداد، فننصحك بمراجعة «التأسيس» ريثما يكتمل، خاصة ما ضعفتَ فيه.</div>':'')+
      '<button class="btn primary" id="st">'+(soon?'افتح التأسيس':'ابدأ من هذا المستوى')+'</button><button class="btn ghost" id="oth">اختر مستوى آخر</button></section>'+
      '<section class="card stack"><h3 style="margin:0">خريطة قدراتك</h3>'+radar(vals)+barsH(vals)+'<small class="muted">المحاور الرمادية لم يبلغها الاختبار.</small></section>';
    if(st.wrong.length){
      html+='<section class="card stack"><h3 style="margin:0">أسئلة أخطأتَ فيها أو لم تعرفها ('+num(st.wrong.length)+')</h3><ul class="lst">'+st.wrong.slice(0,12).map(function(w){
        var q=w.q,ans=q.o?q.o[q.a]:'';
        return '<li>'+tx(q.p||'')+'<br><b>الصواب:</b> '+ans+'<br><small class="muted">'+tx(q.why||'')+'</small></li>';
      }).join('')+'</ul><small class="muted">أُضيفت إلى «أخطائي» لتتدرب عليها لاحقاً.</small></section>';
    }
    html+='<button class="btn ghost" id="hm">الرئيسية</button>';
    view.innerHTML=html;view.scrollTop=0;
    $('#st').onclick=function(){levelScreen(soon?0:rec);};
    $('#oth').onclick=function(){go('levels');};
    $('#hm').onclick=function(){go('home');};
  }
  block();ask();
}

/* ---------- كلمات وجمل أضافها المعلّم من استوديو التسجيل (audio/index.json ← items) ----------
   نوع h: كلمة فيها همزة بصيغتها النطقية، فيحسب المحرّك رسمها وصورها الخاطئة وتعليلها.
   نوع w: كلمة يدوية برسمها الصحيح وصورها الخاطئة وتعليلها.
   نوع dict: جملة للإملاء المسموع في درس «الإملاء المسموع». */
var CUSTOM_N=0;
function mergeCustom(list){
  (list||[]).forEach(function(c){
    try{
      var L=CONTENT[c.lv];if(!L){return;}
      var T=null;L.topics.forEach(function(t){if(!T&&t.title===c.topic){T=t;}});if(!T){T=L.topics[c.ti];}if(!T){return;}
      var it;
      if(c.type==='dict'){
        it=c.ph?H(c.ph,{tag:'dict',sk:'d'}):W(c.say||c.text,[],c.why||'',{tag:'dict',sk:'d'});
        it.s=null;it.say=c.say||it.full;it.custom=true;
        T.qs.push(WRITE(it,{mode:'dict',p:'اكتب الجملة كاملة كتابة صحيحة',sk:'d',d:3}));
        CUSTOM_N++;return;
      }
      it=c.type==='h'?H(c.ph,{}):W(c.say||c.text,(c.wr||[]).slice(),c.why||'',{});
      it.custom=true;if(c.say){it.say=c.say;}if(!it.sk){it.sk=T.sk;}
      var ss=(c.ss||[]).filter(function(x){return x.indexOf('___')>=0;});
      if(ss.length){it.ss=ss;it.s=ss[0];}
      if(!it.wr||!it.wr.length){return;}
      T.items.push(it);ALLITEMS.push(it);CUSTOM_N++;
    }catch(e){}
  });
}
